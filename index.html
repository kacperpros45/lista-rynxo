<script>
        const PUBLIC_API_URL = 'https://api.jsonstorage.net/v1/json/9aaf6816-231f-480e-ba1e-cf5fd2e886d3';
        const API_KEY = '844e8ed1-4f05-4404-b40b-740edfcdf747';

        let appData = {
            users: [],
            levels: [],
            challenges: [],
            pending: [],
            pending_challenges: [],
            records: [],
            challenge_records: [],
            pending_records: [],
            pending_challenge_records: [],
            current_user: localStorage.getItem('rfdl_current_user') || ''
        };

        function fetchDataFromCloud() {
            const xhr = new XMLHttpRequest();
            xhr.open('GET', PUBLIC_API_URL, true);
            xhr.setRequestHeader('Private-Key', API_KEY);
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            const data = JSON.parse(xhr.responseText);
                            if (data && typeof data === 'object') {
                                appData.users = data.users || [];
                                appData.levels = data.levels || [];
                                appData.challenges = data.challenges || [];
                                appData.pending = data.pending || [];
                                appData.pending_challenges = data.pending_challenges || [];
                                appData.records = data.records || [];
                                appData.challenge_records = data.challenge_records || [];
                                appData.pending_records = data.pending_records || [];
                                appData.pending_challenge_records = data.pending_challenge_records || [];
                            }
                        } catch (e) {}
                    } else if (xhr.status === 404) {
                        // Jeśli zasób nie istnieje w chmurze, utwórz go automatycznie
                        saveDataToCloud();
                    }
                }
            };
            xhr.send();
        }

        function saveDataToCloud() {
            const xhr = new XMLHttpRequest();
            xhr.open('PUT', PUBLIC_API_URL, true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.setRequestHeader('Private-Key', API_KEY);
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 404) {
                    // Jeśli PUT zwróci 404, robimy POST inicjalizacyjny
                    const postXhr = new XMLHttpRequest();
                    postXhr.open('POST', 'https://api.jsonstorage.net/v1/json', true);
                    postXhr.setRequestHeader('Content-Type', 'application/json');
                    postXhr.setRequestHeader('Private-Key', API_KEY);
                    postXhr.send(JSON.stringify(appData));
                }
            };
            xhr.send(JSON.stringify(appData));
        }

        function pobierzUzytkownikow() { return appData.users || []; }
        function zapiszUzytkownikow(u) { appData.users = u; saveDataToCloud(); }
        function pobierzPoziomy() { return appData.levels || []; }
        function zapiszPoziomy(l) { appData.levels = l; saveDataToCloud(); }
        function pobierzChallenge() { return appData.challenges || []; }
        function zapiszChallenge(c) { appData.challenges = c; saveDataToCloud(); }
        function pobierzOczekujace() { return appData.pending || []; }
        function zapiszOczekujace(p) { appData.pending = p; saveDataToCloud(); }
        function pobierzOczekujaceChallenge() { return appData.pending_challenges || []; }
        function zapiszOczekujaceChallenge(pc) { appData.pending_challenges = pc; saveDataToCloud(); }
        function pobierzRekordy() { return appData.records || []; }
        function zapiszRekordy(r) { appData.records = r; saveDataToCloud(); }
        function pobierzChallengeRekordy() { return appData.challenge_records || []; }
        function zapiszChallengeRekordy(cr) { appData.challenge_records = cr; saveDataToCloud(); }
        function pobierzOczekujaceRekordy() { return appData.pending_records || []; }
        function zapiszOczekujaceRekordy(pr) { appData.pending_records = pr; saveDataToCloud(); }
        function pobierzOczekujaceChallengeRekordy() { return appData.pending_challenge_records || []; }
        function zapiszOczekujaceChallengeRekordy(pcr) { appData.pending_challenge_records = pcr; saveDataToCloud(); }
        
        function pobierzZalogowanego() { return appData.current_user || ''; }
        function ustawZalogowanego(u) { 
            appData.current_user = u ? u.trim() : ''; 
            localStorage.setItem('rfdl_current_user', appData.current_user);
            saveDataToCloud();
            odswiezMenu(); 
        }

        function czyJestModem(login) {
            if (!login) return false;
            return login.trim().toLowerCase() === 'kacperpros45';
        }

        function obliczPunktyZaPoziom(index) {
            const punkty = 250 - (index * 2.5);
            return Math.max(0, Number(punkty.toFixed(1)));
        }

        function edytujPozycjePoziomu(index, kategoria = 'level') {
            const lista = kategoria === 'challenge' ? [...pobierzChallenge()] : [...pobierzPoziomy()];
            const nazwaListy = kategoria === 'challenge' ? 'Challenge List' : 'Demon List';
            const nowaPozycja = prompt(`Aktualna pozycja w ${nazwaListy}: ${index + 1}. Podaj nową pozycję (1-${lista.length}):`);
            if (nowaPozycja === null) return;
            
            let n = parseInt(nowaPozycja) - 1;
            if (isNaN(n) || n < 0 || n >= lista.length) {
                alert("Niepoprawna pozycja!");
                return;
            }

            const [element] = lista.splice(index, 1);
            lista.splice(n, 0, element);
            
            if (kategoria === 'challenge') {
                zapiszChallenge(lista);
            } else {
                zapiszPoziomy(lista);
            }
            zmienStrone('panel_moda');
        }

        function odswiezMenu() {
            const zalogowany = pobierzZalogowanego();
            const nav = document.getElementById('nav-menu');
            if (!nav) return;
            
            let html = `
                <a onclick="zmienStrone('home')">Strona główna</a>
                <a onclick="zmienStrone('lista')">Listy</a>
                <a onclick="zmienStrone('leaderboard')">Leaderboard</a>
            `;

            if (zalogowany) {
                let modBadge = czyJestModem(zalogowany) ? '<span class="badge-mod">MOD</span>' : '';
                html += `
                    <a onclick="zmienStrone('dodaj')">Zgłoś poziom</a>
                    <a onclick="zmienStrone('zglos_rekord')">Zgłoś rekord</a>
                `;
                
                if (czyJestModem(zalogowany)) {
                    html += `<a onclick="zmienStrone('panel_moda')" style="color:#ffa502; font-weight:bold;">🛡️ Panel Moda</a>`;
                }

                html += `
                    <span class="user-info">👤 ${zalogowany} ${modBadge}</span>
                    <a onclick="wyloguj()" style="color:#ff4757;">Wyloguj</a>
                `;
            } else {
                html += `
                    <a onclick="zmienStrone('login')">Logowanie</a>
                    <a onclick="zmienStrone('rejestracja')">Rejestracja</a>
                `;
            }

            nav.innerHTML = html;
        }

        function wyloguj() {
            ustawZalogowanego('');
            zmienStrone('home');
        }

        function zmienStrone(typ, extraParam = null) {
            fetchDataFromCloud();
            const main = document.getElementById('zawartosc');
            if (!main) return;
            odswiezMenu();
            const zalogowany = pobierzZalogowanego();
            const jestModem = czyJestModem(zalogowany);
            
            if (typ === 'home') {
                main.innerHTML = `
                    <h1>Rynxo Fandom Demon List</h1>
                    <p>Oficjalny publiczny ranking poziomów i wyzwań. Każdy widzi te same dane w czasie rzeczywistym!</p>
                    <div class="sync-status">🟢 Połączono z jsonstorage.net</div>
                `;
            } else if (typ === 'lista') {
                const aktywnaKategoria = extraParam === 'challenge' ? 'challenge' : 'level';
                const poziomy = aktywnaKategoria === 'challenge' ? pobierzChallenge() : pobierzPoziomy();
                
                let listaHtml = poziomy.length === 0 ? `<p>Brak zatwierdzonych pozycji w tej kategorii.</p>` : '<div class="level-list">';
                
                poziomy.forEach((lvl, index) => {
                    let modActions = jestModem ? `
                        <button class="btn-reject" onclick="usunZatwierdzonyPoziomLista(${index}, '${aktywnaKategoria}')" style="padding: 8px 12px; font-size: 0.9rem;">Usuń</button>
                    ` : '';

                    const punktyZaLvl = obliczPunktyZaPoziom(index);

                    listaHtml += `
                        <div class="level-card">
                            <div style="display: flex; align-items: center; width: 100%; justify-content: space-between;">
                                <div style="display: flex; align-items: center;">
                                    <div class="level-pos">#${index + 1}</div>
                                    <div class="level-info">
                                        <h3 class="clickable-level" onclick="zmienStrone('szczegoly_poziomu', '${encodeURIComponent(lvl.nazwa)}')">${lvl.nazwa} <span style="font-size:0.8rem; color:#aaa;">(ID: ${lvl.id})</span></h3>
                                        <span>Zweryfikował: ${lvl.autor} | <a href="${lvl.nagranie}" target="_blank">${lvl.nagranie}</a></span>
                                        <span style="color: #2ed573; font-weight: bold; margin-top: 4px;">+${punktyZaLvl} pkt</span>
                                    </div>
                                </div>
                                <div>${modActions}</div>
                            </div>
                        </div>
                    `;
                });
                if (poziomy.length > 0) listaHtml += '</div>';

                main.innerHTML = `
                    <h1>Listy poziomów</h1>
                    <div class="tabs-container">
                        <button class="tab-btn ${aktywnaKategoria === 'level' ? 'active' : ''}" onclick="zmienStrone('lista', 'level')">Demon List</button>
                        <button class="tab-btn ${aktywnaKategoria === 'challenge' ? 'active' : ''}" onclick="zmienStrone('lista', 'challenge')">Challenge List</button>
                    </div>
                    <p>Wybierz kategorię i kliknij na nazwę, aby zobaczyć szczegóły oraz rekordy.</p>
                    ${listaHtml}
                `;
            } else if (typ === 'szczegoly_poziomu') {
                const nazwaPoziomu = decodeURIComponent(extraParam);
                const poziomy = pobierzPoziomy();
                const challenge = pobierzChallenge();
                
                const isChallenge = challenge.some(c => c.nazwa.toLowerCase() === nazwaPoziomu.toLowerCase());
                const listaAktualna = isChallenge ? challenge : poziomy;
                const indexPoziomu = listaAktualna.findIndex(l => l.nazwa.toLowerCase() === nazwaPoziomu.toLowerCase());
                
                const lvlObj = indexPoziomu !== -1 ? listaAktualna[indexPoziomu] : null;
                const punktyZaTenPoziom = indexPoziomu !== -1 ? obliczPunktyZaPoziom(indexPoziomu) : 250;
                
                const ukoczenia = isChallenge ? pobierzChallengeRekordy().filter(r => r.poziom.toLowerCase() === nazwaPoziomu.toLowerCase()) : pobierzRekordy().filter(r => r.poziom.toLowerCase() === nazwaPoziomu.toLowerCase());

                let listaUkonczonychHtml = ukoczenia.length === 0 ? '<p>Nikt jeszcze nie ukończył tego poziomu.</p>' : '<div class="level-list">';
                
                ukoczenia.forEach(rec => {
                    let modTag = czyJestModem(rec.gracz) ? '<span class="badge-mod">MOD</span>' : '';
                    listaUkonczonychHtml += `
                        <div class="level-card">
                            <div class="level-info" style="text-align: left; width: 100%; display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <h3 class="clickable-level" onclick="zmienStrone('profil', '${rec.gracz}')">${rec.gracz} ${modTag}</h3>
                                    <span><a href="${rec.url}" target="_blank">${rec.url}</a></span>
                                </div>
                            </div>
                        </div>
                    `;
                });
                if (ukoczenia.length > 0) listaUkonczonychHtml += '</div>';

                main.innerHTML = `
                    <div class="profile-box">
                        <div class="level-points-badge">+${punktyZaTenPoziom} pkt</div>
                        <h2>${lvlObj ? lvlObj.nazwa : nazwaPoziomu}</h2>
                        <span style="color: #aaa; font-size: 0.95rem; display: block; margin-top: -5px; margin-bottom: 15px;">Zweryfikował: ${lvlObj ? lvlObj.autor : 'Nieznany'}</span>
                        <div class="profile-stats">
                            <div class="profile-stats-row">
                                <div class="stat-card">
                                    <span>ID Poziomu</span>
                                    <strong>${lvlObj ? lvlObj.id : 'Brak'}</strong>
                                </div>
                                <div class="stat-card">
                                    <span>Liczba ukończeń</span>
                                    <strong>${ukoczenia.length} graczy</strong>
                                </div>
                            </div>
                        </div>
                    </div>
                    <h3 style="color:#fff; text-align:left; width:100%; margin-top:10px;">Gracze, którzy ukończyli ten poziom:</h3>
                    ${listaUkonczonychHtml}
                    <button onclick="zmienStrone('lista')" style="margin-top:20px; width:100%;">Powrót do listy</button>
                `;
            } else if (typ === 'leaderboard') {
                const aktywnaKategoria = extraParam === 'challenge' ? 'challenge' : 'level';
                const rekordy = aktywnaKategoria === 'challenge' ? pobierzChallengeRekordy() : pobierzRekordy();
                const listaPoziomow = aktywnaKategoria === 'challenge' ? pobierzChallenge() : pobierzPoziomy();
                
                let allNames = new Set();
                pobierzUzytkownikow().forEach(u => { if (u && u.login) allNames.add(u.login); });
                pobierzRekordy().forEach(r => { if (r && r.gracz) allNames.add(r.gracz); });
                pobierzChallengeRekordy().forEach(r => { if (r && r.gracz) allNames.add(r.gracz); });
                allNames.add('kacperpros45');

                let punkty = {};
                allNames.forEach(login => { punkty[login] = 0; });
                
                rekordy.forEach(rec => {
                    const idx = listaPoziomow.findIndex(l => l.nazwa.toLowerCase() === rec.poziom.toLowerCase());
                    const pktZaLvl = idx !== -1 ? obliczPunktyZaPoziom(idx) : 0;
                    if (punkty[rec.gracz] !== undefined) {
                        punkty[rec.gracz] += pktZaLvl;
                    } else {
                        punkty[rec.gracz] = pktZaLvl;
                    }
                });

                let ranking = Object.keys(punkty)
                    .map(login => ({ login, punkty: Number(punkty[login].toFixed(1)) }))
                    .sort((a, b) => b.punkty - a.punkty);

                let rankingHtml = ranking.length === 0 ? '<p>Brak graczy w bazie.</p>' : '<div class="level-list">';
                ranking.forEach((gracz, index) => {
                    let modTag = czyJestModem(gracz.login) ? '<span class="badge-mod">MOD</span>' : '';
                    rankingHtml += `
                        <div class="ranking-card" onclick="zmienStrone('profil', '${gracz.login}')">
                            <div style="display: flex; align-items: center; gap: 15px; width: 100%;">
                                <div class="level-pos">#${index + 1}</div>
                                <div class="level-info" style="flex: 1;">
                                    <h3>${gracz.login} ${modTag}</h3>
                                    <span>Punkty: ${gracz.punkty} pkt</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
                if (ranking.length > 0) rankingHtml += '</div>';

                main.innerHTML = `
                    <h1>Leaderboard</h1>
                    <div class="tabs-container">
                        <button class="tab-btn ${aktywnaKategoria === 'level' ? 'active' : ''}" onclick="zmienStrone('leaderboard', 'level')">Demon List</button>
                        <button class="tab-btn ${aktywnaKategoria === 'challenge' ? 'active' : ''}" onclick="zmienStrone('leaderboard', 'challenge')">Challenge List</button>
                    </div>
                    <p>Publiczny ranking graczy aktualizowany w czasie rzeczywistym.</p>
                    ${rankingHtml}
                `;
            } else if (typ === 'profil') {
                const nazwaGracza = extraParam;
                const rekordyDemon = pobierzRekordy();
                const rekordyChallenge = pobierzChallengeRekordy();
                const poziomy = pobierzPoziomy();
                const challenge = pobierzChallenge();

                const graczDemonRec = rekordyDemon.filter(r => r.gracz.toLowerCase() === nazwaGracza.toLowerCase());
                const graczChalRec = rekordyChallenge.filter(r => r.gracz.toLowerCase() === nazwaGracza.toLowerCase());

                let punktyDemon = 0;
                graczDemonRec.forEach(rec => {
                    const idx = poziomy.findIndex(l => l.nazwa.toLowerCase() === rec.poziom.toLowerCase());
                    if (idx !== -1) punktyDemon += obliczPunktyZaPoziom(idx);
                });

                let punktyChallenge = 0;
                graczChalRec.forEach(rec => {
                    const idx = challenge.findIndex(c => c.nazwa.toLowerCase() === rec.poziom.toLowerCase());
                    if (idx !== -1) punktyChallenge += obliczPunktyZaPoziom(idx);
                });

                let hardestDemon = "Brak";
                let najnizszyIdxDemon = 999999;
                graczDemonRec.forEach(rec => {
                    const idx = poziomy.findIndex(l => l.nazwa.toLowerCase() === rec.poziom.toLowerCase());
                    if (idx !== -1 && idx < najnizszyIdxDemon) {
                        najnizszyIdxDemon = idx;
                        hardestDemon = `#${idx + 1} - ${poziomy[idx].nazwa}`;
                    }
                });

                let hardestChallenge = "Brak";
                let najnizszyIdxChal = 999999;
                graczChalRec.forEach(rec => {
                    const idx = challenge.findIndex(c => c.nazwa.toLowerCase() === rec.poziom.toLowerCase());
                    if (idx !== -1 && idx < najnizszyIdxChal) {
                        najnizszyIdxChal = idx;
                        hardestChallenge = `#${idx + 1} - ${challenge[idx].nazwa}`;
                    }
                });

                let modTag = czyJestModem(nazwaGracza) ? '<span class="badge-mod">MOD</span>' : '';

                let historiaDemonHtml = graczDemonRec.length === 0 ? '<p>Brak ukończonych poziomów Demon List.</p>' : '<div class="level-list">';
                graczDemonRec.forEach(rec => {
                    const globalIndex = rekordyDemon.findIndex(r => r.gracz.toLowerCase() === rec.gracz.toLowerCase() && r.poziom.toLowerCase() === rec.poziom.toLowerCase() && r.url === rec.url);
                    const idx = poziomy.findIndex(l => l.nazwa.toLowerCase() === rec.poziom.toLowerCase());
                    let posText = idx !== -1 ? `(#${idx + 1} - +${obliczPunktyZaPoziom(idx)} pkt)` : '';
                    let usunPrzycisk = jestModem ? `<button class="btn-reject" onclick="usunZatwierdzonyRekord(${globalIndex}, 'level')" style="padding: 6px 12px; font-size: 0.85rem;">Usuń</button>` : '';

                    historiaDemonHtml += `
                        <div class="level-card">
                            <div class="level-info" style="text-align: left; width: 100%; display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <h3 class="clickable-level" onclick="zmienStrone('szczegoly_poziomu', '${encodeURIComponent(rec.poziom)}')">${rec.poziom} ${posText}</h3>
                                    <span><a href="${rec.url}" target="_blank">${rec.url}</a></span>
                                </div>
                                <div>${usunPrzycisk}</div>
                            </div>
                        </div>
                    `;
                });
                if (graczDemonRec.length > 0) historiaDemonHtml += '</div>';

                let historiaChallengeHtml = graczChalRec.length === 0 ? '<p>Brak ukończonych poziomów Challenge List.</p>' : '<div class="level-list">';
                graczChalRec.forEach(rec => {
                    const globalIndex = rekordyChallenge.findIndex(r => r.gracz.toLowerCase() === rec.gracz.toLowerCase() && r.poziom.toLowerCase() === rec.poziom.toLowerCase() && r.url === rec.url);
                    const idx = challenge.findIndex(c => c.nazwa.toLowerCase() === rec.poziom.toLowerCase());
                    let posText = idx !== -1 ? `(#${idx + 1} - +${obliczPunktyZaPoziom(idx)} pkt)` : '';
                    let usunPrzycisk = jestModem ? `<button class="btn-reject" onclick="usunZatwierdzonyRekord(${globalIndex}, 'challenge')" style="padding: 6px 12px; font-size: 0.85rem;">Usuń</button>` : '';

                    historiaChallengeHtml += `
                        <div class="level-card">
                            <div class="level-info" style="text-align: left; width: 100%; display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <h3 class="clickable-level" onclick="zmienStrone('szczegoly_poziomu', '${encodeURIComponent(rec.poziom)}')">${rec.poziom} ${posText}</h3>
                                    <span><a href="${rec.url}" target="_blank">${rec.url}</a></span>
                                </div>
                                <div>${usunPrzycisk}</div>
                            </div>
                        </div>
                    `;
                });
                if (graczChalRec.length > 0) historiaChallengeHtml += '</div>';

                main.innerHTML = `
                    <div class="profile-box">
                        <h2>Profil gracza: ${nazwaGracza} ${modTag}</h2>
                        <div class="profile-stats">
                            <div class="profile-stats-row">
                                <div class="stat-card">
                                    <span>Punkty Demon List</span>
                                    <strong>${Number(punktyDemon.toFixed(1))} pkt</strong>
                                </div>
                                <div class="stat-card">
                                    <span>Punkty Challenge List</span>
                                    <strong>${Number(punktyChallenge.toFixed(1))} pkt</strong>
                                </div>
                                <div class="stat-card">
                                    <span>Hardest (Demon)</span>
                                    <strong>${hardestDemon}</strong>
                                </div>
                            </div>
                            <div class="profile-stats-row">
                                <div class="stat-card-full">
                                    <span>Hardest (Challenge)</span>
                                    <strong>${hardestChallenge}</strong>
                                </div>
                            </div>
                        </div>
                    </div>
                    <h3 style="color:#fff; text-align:left; width:100%; margin-top:10px;">Ukończone (Demon List):</h3>
                    ${historiaDemonHtml}
                    <h3 style="color:#fff; text-align:left; width:100%; margin-top:20px;">Ukończone (Challenge List):</h3>
                    ${historiaChallengeHtml}
                    <button onclick="zmienStrone('leaderboard')" style="margin-top:25px; width:100%;">Powrót do Leaderboardu</button>
                `;
            } else if (typ === 'login') {
                main.innerHTML = `
                    <h1>Logowanie</h1>
                    <div class="form-box">
                        <input type="text" id="log-login" placeholder="Nazwa użytkownika">
                        <input type="password" id="log-pass" placeholder="Hasło">
                        <div id="log-error" class="error-msg"></div>
                        <button onclick="zaloguj()">Zaloguj się</button>
                    </div>
                `;
            } else if (typ === 'rejestracja') {
                main.innerHTML = `
                    <h1>Rejestracja konta</h1>
                    <div class="form-box">
                        <input type="text" id="reg-login" placeholder="Nazwa użytkownika">
                        <input type="password" id="reg-pass" placeholder="Hasło">
                        <div id="reg-error" class="error-msg"></div>
                        <button onclick="zarejestruj()">Utwórz konto</button>
                    </div>
                `;
            } else if (typ === 'dodaj') {
                if (!zalogowany) { zmienStrone('login'); return; }
                main.innerHTML = `
                    <h1>Zgłoś poziom</h1>
                    <p style="font-size:0.9rem;">Zgłaszasz jako: <strong style="color:#ff4757;">${zalogowany}</strong></p>
                    <div class="form-box">
                        <select id="lvl-kategoria">
                            <option value="level">Demon List</option>
                            <option value="challenge">Challenge List</option>
                        </select>
                        <input type="text" id="lvl-name" placeholder="Nazwa poziomu">

                zatwierdzoneChallenge.forEach((lvl, index) => {

                                <h3>#${index + 1} - ${lvl.nazwa} (ID: ${lvl.id}) — <strong>+${pktVal} pkt</strong></h3>

                    ${activeChalRecordsHtml}

        function aktualizujListePoziomowRekordu() {
            const kategoria = document.getElementById('rec-kategoria').value;
            const selectPoziom = document.getElementById('rec-level');
            if (!selectPoziom) return;
            const poziomy = kategoria === 'challenge' ? pobierzChallenge() : pobierzPoziomy();
            let opcje = '<option value="">Wybierz poziom...</option>';
            poziomy.forEach(lvl => {
                opcje += `<option value="${lvl.nazwa}">${lvl.nazwa} (ID: ${lvl.id})</option>`;
            });
            selectPoziom.innerHTML = opcje;
        }

        function zarejestruj() {
            const login = document.getElementById('reg-login').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();
            const err = document.getElementById('reg-error');
            if (!login || !pass) { err.innerText = "Wypełnij wszystkie pola!"; return; }
            let users = [...pobierzUzytkownikow()];
            if (users.some(u => u.login.toLowerCase() === login.toLowerCase())) {
                err.innerText = "Taki użytkownik już istnieje!";
                return;
            }
            users.push({ login, pass });
            zapiszUzytkownikow(users);
            ustawZalogowanego(login);
            zmienStrone('home');
        }

        function zaloguj() {
            const login = document.getElementById('log-login').value.trim();
            const pass = document.getElementById('log-pass').value.trim();
            const err = document.getElementById('log-error');
            let users = pobierzUzytkownikow();
            const user = users.find(u => u.login.toLowerCase() === login.toLowerCase() && u.pass === pass);
            if (!user && login.toLowerCase() !== 'kacperpros45') {
                err.innerText = "Niepoprawny login lub hasło!";
                return;
            }
            ustawZalogowanego(login);
            zmienStrone('home');
        }

        function wyslijZgłoszenie() {
            const kategoria = document.getElementById('lvl-kategoria').value;
            const nazwa = document.getElementById('lvl-name').value.trim();
            const id = document.getElementById('lvl-id').value.trim();
            const nagranie = document.getElementById('lvl-nagranie').value.trim();
            const pozycja = parseInt(document.getElementById('lvl-pozycja').value);
            const err = document.getElementById('lvl-error');
            const autor = pobierzZalogowanego();
            if (!autor) { alert("Musisz być zalogowany!"); zmienStrone('login'); return; }
            if (!nazwa || !id || !nagranie || isNaN(pozycja)) { err.innerText = "Wypełnij wszystkie pola poprawnie!"; return; }

            if (kategoria === 'challenge') {
                let oczekujace = [...pobierzOczekujaceChallenge()];
                oczekujace.push({ nazwa, id, nagranie, pozycja, autor });
                zapiszOczekujaceChallenge(oczekujace);
            } else {
                let oczekujace = [...pobierzOczekujace()];
                oczekujace.push({ nazwa, id, nagranie, pozycja, autor });
                zapiszOczekujace(oczekujace);
            }
            alert("Zgłoszenie poziomu wysłane!");
            zmienStrone('lista', kategoria);
        }

        function wyslijRekord() {
            const kategoria = document.getElementById('rec-kategoria').value;
            const poziom = document.getElementById('rec-level').value;
            const url = document.getElementById('rec-url').value.trim();
            const err = document.getElementById('rec-error');
            const gracz = pobierzZalogowanego();
            if (!gracz) { alert("Musisz być zalogowany!"); zmienStrone('login'); return; }
            if (!poziom || !url) { err.innerText = "Wypełnij wszystkie pola!"; return; }

            if (kategoria === 'challenge') {
                let oczekujace = [...pobierzOczekujaceChallengeRekordy()];
                oczekujace.push({ poziom, url, gracz });
                zapiszOczekujaceChallengeRekordy(oczekujace);
            } else {
                let oczekujace = [...pobierzOczekujaceRekordy()];
                oczekujace.push({ poziom, url, gracz });
                zapiszOczekujaceRekordy(oczekujace);
            }
            alert("Zgłoszenie rekordu wysłane!");
            zmienStrone('leaderboard', kategoria);
        }

        function akceptujZgłoszenie(index, kategoria = 'level') {
            if (kategoria === 'challenge') {
                let oczekujace = [...pobierzOczekujaceChallenge()];
                let lista = [...pobierzChallenge()];
                let rekordy = [...pobierzChallengeRekordy()];
                let zatwierdzony = oczekujace.splice(index, 1)[0];
                let docelowaPozycja = zatwierdzony.pozycja - 1;
                if (docelowaPozycja < 0) docelowaPozycja = 0;
                if (docelowaPozycja > lista.length) lista.push(zatwierdzony);
                else lista.splice(docelowaPozycja, 0, zatwierdzony);
                rekordy.push({ poziom: zatwierdzony.nazwa, url: zatwierdzony.nagranie, gracz: zatwierdzony.autor });
                zapiszOczekujaceChallenge(oczekujace);
                zapiszChallenge(lista);
                zapiszChallengeRekordy(rekordy);
            } else {
                let oczekujace = [...pobierzOczekujace()];
                let lista = [...pobierzPoziomy()];
                let rekordy = [...pobierzRekordy()];
                let zatwierdzony = oczekujace.splice(index, 1)[0];
                let docelowaPozycja = zatwierdzony.pozycja - 1;
                if (docelowaPozycja < 0) docelowaPozycja = 0;
                if (docelowaPozycja > lista.length) lista.push(zatwierdzony);
                else lista.splice(docelowaPozycja, 0, zatwierdzony);
                rekordy.push({ poziom: zatwierdzony.nazwa, url: zatwierdzony.nagranie, gracz: zatwierdzony.autor });
                zapiszOczekujace(oczekujace);
                zapiszPoziomy(lista);
                zapiszRekordy(rekordy);
            }
            zmienStrone('panel_moda');
        }

        function odrzucZgłoszenie(index, kategoria = 'level') {
            if (kategoria === 'challenge') {
                let oczekujace = [...pobierzOczekujaceChallenge()];
                oczekujace.splice(index, 1);
                zapiszOczekujaceChallenge(oczekujace);
            } else {
                let oczekujace = [...pobierzOczekujace()];
                oczekujace.splice(index, 1);
                zapiszOczekujace(oczekujace);
            }
            zmienStrone('panel_moda');
        }

        function akceptujRekord(index, kategoria = 'level') {
            if (kategoria === 'challenge') {
                let oczekujace = [...pobierzOczekujaceChallengeRekordy()];
                let rekordy = [...pobierzChallengeRekordy()];
                let zatwierdzonyRec = oczekujace.splice(index, 1)[0];
                rekordy.push(zatwierdzonyRec);
                zapiszOczekujaceChallengeRekordy(oczekujace);
                zapiszChallengeRekordy(rekordy);
            } else {
                let oczekujace = [...pobierzOczekujaceRekordy()];
                let rekordy = [...pobierzRekordy()];
                let zatwierdzonyRec = oczekujace.splice(index, 1)[0];
                rekordy.push(zatwierdzonyRec);
                zapiszOczekujaceRekordy(oczekujace);
                zapiszRekordy(rekordy);
            }
            zmienStrone('panel_moda');
        }

        function odrzucRekord(index, kategoria = 'level') {
            if (kategoria === 'challenge') {
                let oczekujace = [...pobierzOczekujaceChallengeRekordy()];
                oczekujace.splice(index, 1);
                zapiszOczekujaceChallengeRekordy(oczekujace);
            } else {
                let oczekujace = [...pobierzOczekujaceRekordy()];
                oczekujace.splice(index, 1);
                zapiszOczekujaceRekordy(oczekujace);
            }
            zmienStrone('panel_moda');
        }

        function usunZatwierdzonyPoziom(index, kategoria = 'level') {
            if (confirm("Usunąć ten poziom?")) {
                if (kategoria === 'challenge') {
                    let lista = [...pobierzChallenge()];
                    let usunietyLvl = lista.splice(index, 1)[0];
                    zapiszChallenge(lista);
                    if (usunietyLvl) {
                        let rekordy = pobierzChallengeRekordy();
                        zapiszChallengeRekordy(rekordy.filter(r => r.poziom.toLowerCase() !== usunietyLvl.nazwa.toLowerCase()));
                    }
                } else {
                    let lista = [...pobierzPoziomy()];
                    let usunietyLvl = lista.splice(index, 1)[0];
                    zapiszPoziomy(lista);
                    if (usunietyLvl) {
                        let rekordy = pobierzRekordy();
                        zapiszRekordy(rekordy.filter(r => r.poziom.toLowerCase() !== usunietyLvl.nazwa.toLowerCase()));
                    }
                }
                zmienStrone('panel_moda');
            }
        }

        function usunZatwierdzonyPoziomLista(index, kategoria = 'level') {
            if (confirm("Usunąć ten poziom?")) {
                if (kategoria === 'challenge') {
                    let lista = [...pobierzChallenge()];
                    let usunietyLvl = lista.splice(index, 1)[0];
                    zapiszChallenge(lista);
                    if (usunietyLvl) {
                        let rekordy = pobierzChallengeRekordy();
                        zapiszChallengeRekordy(rekordy.filter(r => r.poziom.toLowerCase() !== usunietyLvl.nazwa.toLowerCase()));
                    }
                } else {
                    let lista = [...pobierzPoziomy()];
                    let usunietyLvl = lista.splice(index, 1)[0];
                    zapiszPoziomy(lista);
                    if (usunietyLvl) {
                        let rekordy = pobierzRekordy();
                        zapiszRekordy(rekordy.filter(r => r.poziom.toLowerCase() !== usunietyLvl.nazwa.toLowerCase()));
                    }
                }
                zmienStrone('lista', kategoria);
            }
        }

        function usunZatwierdzonyRekord(index, kategoria = 'level') {
            if (confirm("Usunąć ten rekord?")) {
                if (kategoria === 'challenge') {
                    let rekordy = [...pobierzChallengeRekordy()];
                    rekordy.splice(index, 1);
                    zapiszChallengeRekordy(rekordy);
                } else {
                    let rekordy = [...pobierzRekordy()];
                    rekordy.splice(index, 1);
                    zapiszRekordy(rekordy);
                }
                zmienStrone('panel_moda');
            }
        }

        function init() {
            fetchDataFromCloud();
            odswiezMenu();
            zmienStrone('home');
        }

        init();
    </script>
