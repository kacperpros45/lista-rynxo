<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rynxo Fandom Demon List (RFDL)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #e0e0e0; display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: #1f1f1f; border-bottom: 2px solid #333; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: bold; color: #ff4757; letter-spacing: 1px; cursor: pointer; }
        nav { display: flex; align-items: center; gap: 15px; }
        nav a, nav span { color: #aaa; text-decoration: none; transition: color 0.2s; cursor: pointer; font-size: 0.95rem; white-space: nowrap; }
        nav a:hover, nav span:hover { color: #fff; }
        .user-info { color: #ff4757; font-weight: bold; }
        .badge-mod { background: #ffa502; color: #121212; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; margin-left: 5px; }
        main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 40px; width: 100%; max-width: 900px; margin: 0 auto; }
        h1 { font-size: 2.5rem; margin-bottom: 20px; color: #fff; }
        p { color: #777; font-size: 1.1rem; margin-bottom: 20px; }
        .form-box { background: #1a1a1a; padding: 30px; border-radius: 8px; border: 1px solid #333; width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 15px; text-align: left; }
        input, select, textarea { padding: 14px; background: #121212; border: 1px solid #333; color: #fff; border-radius: 6px; font-size: 16px; }
        button { padding: 15px; background: #ff4757; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #ff6b81; }
        button.btn-accept { background: #2ed573; padding: 10px 16px; font-size: 0.95rem; }
        button.btn-reject { background: #ff4757; padding: 10px 16px; font-size: 0.95rem; }
        .level-card, .ranking-card { background: #1a1a1a; border: 1px solid #333; padding: 15px 20px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; text-align: left; width: 100%; margin-top: 10px; }
        .clickable-level { color: #fff; font-size: 1.2rem; cursor: pointer; }
        .clickable-level:hover { color: #ff4757; text-decoration: underline; }
        .level-info span { color: #888; font-size: 0.9rem; display: block; margin-top: 3px; }
        .level-info a { color: #ff4757; text-decoration: none; word-break: break-all; }
        .level-pos { font-size: 1.5rem; font-weight: bold; color: #ff4757; margin-right: 20px; min-width: 40px; }
        .profile-box { background: #1a1a1a; border: 1px solid #333; padding: 25px; border-radius: 8px; width: 100%; text-align: left; margin-bottom: 20px; position: relative; }
        .level-points-badge { position: absolute; top: 25px; right: 25px; background: #2ed573; color: #121212; padding: 8px 14px; border-radius: 6px; font-weight: bold; }
        .profile-stats { display: flex; flex-direction: column; gap: 15px; margin-top: 15px; width: 100%; }
        .profile-stats-row { display: flex; gap: 15px; width: 100%; }
        .stat-card, .stat-card-full { background: #121212; padding: 15px; border-radius: 6px; border: 1px solid #222; flex: 1; }
        .stat-card-full { width: 100%; }
        .stat-card span, .stat-card-full span { color: #777; font-size: 0.85rem; display: block; }
        .stat-card strong, .stat-card-full strong { color: #ff4757; font-size: 1.3rem; }
        footer { background-color: #1f1f1f; text-align: center; padding: 15px; font-size: 0.9rem; color: #555; border-top: 1px solid #222; }
        .error-msg { color: #ff4757; font-size: 0.9rem; }
        .tabs-container { display: flex; gap: 10px; margin-bottom: 20px; width: 100%; }
        .tab-btn { flex: 1; padding: 12px; background: #1a1a1a; border: 1px solid #333; color: #aaa; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .tab-btn.active { background: #ff4757; color: white; border-color: #ff4757; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="zmienStrone('home')">RFDL</div>
        <nav id="nav-menu"></nav>
    </header>

    <main id="zawartosc">Wczytywanie danych z serwera...</main>

    <footer>
        &copy; 2026 Rynxo Fandom Demon List. Wszelkie prawa zastrzeżone.
    </footer>

    <script>
       const API_URL = "https://api.jsonstorage.net/v1/json/0210e929-d634-4fa1-aeba-cee1faa34b62?apiKey=21b35726-ebae-4249-bec4-2b52d9694f02";
       const API_KEY = "21b35726-ebae-4249-bec4-2b52d9694f02";

        let db = {
            rfdl_users: [],
            rfdl_levels: [],
            rfdl_challenges: [],
            rfdl_pending: [],
            rfdl_pending_challenges: [],
            rfdl_records: [],
            rfdl_challenge_records: [],
            rfdl_pending_records: [],
            rfdl_pending_challenge_records: [],
            rfdl_current_user: ''
        };

        async function wczytajDaneZServera() {
            try {
                const response = await fetch(API_URL);
                if (response.ok) {
                    const data = await response.json();
                    db = { ...db, ...data };
                }
            } catch (error) {
                console.error("Błąd podczas pobierania danych:", error);
            }
            odswiezMenu();
            zmienStrone('home');
        }

        async function zapiszNaSerwerze() {
            try {
                await fetch(`${API_URL}?apiKey=${API_KEY}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(db)
                });
            } catch (error) {
                console.error("Błąd podczas zapisu danych:", error);
            }
        }

        function pobierzUzytkownikow() { return db.rfdl_users || []; }
        async function zapiszUzytkownikow(u) { db.rfdl_users = u; await zapiszNaSerwerze(); }
        
        function pobierzPoziomy() { return db.rfdl_levels || []; }
        async function zapiszPoziomy(l) { db.rfdl_levels = l; await zapiszNaSerwerze(); }

        function pobierzChallenge() { return db.rfdl_challenges || []; }
        async function zapiszChallenge(c) { db.rfdl_challenges = c; await zapiszNaSerwerze(); }

        function pobierzOczekujace() { return db.rfdl_pending || []; }
        async function zapiszOczekujace(p) { db.rfdl_pending = p; await zapiszNaSerwerze(); }

        function pobierzOczekujaceChallenge() { return db.rfdl_pending_challenges || []; }
        async function zapiszOczekujaceChallenge(pc) { db.rfdl_pending_challenges = pc; await zapiszNaSerwerze(); }

        function pobierzRekordy() { return db.rfdl_records || []; }
        async function zapiszRekordy(r) { db.rfdl_records = r; await zapiszNaSerwerze(); }

        function pobierzChallengeRekordy() { return db.rfdl_challenge_records || []; }
        async function zapiszChallengeRekordy(cr) { db.rfdl_challenge_records = cr; await zapiszNaSerwerze(); }

        function pobierzOczekujaceRekordy() { return db.rfdl_pending_records || []; }
        async function zapiszOczekujaceRekordy(pr) { db.rfdl_pending_records = pr; await zapiszNaSerwerze(); }

        function pobierzOczekujaceChallengeRekordy() { return db.rfdl_pending_challenge_records || []; }
        async function zapiszOczekujaceChallengeRekordy(pcr) { db.rfdl_pending_challenge_records = pcr; await zapiszNaSerwerze(); }

        function pobierzZalogowanego() { return db.rfdl_current_user || ''; }
        async function ustawZalogowanego(u) { db.rfdl_current_user = u; await zapiszNaSerwerze(); odswiezMenu(); }

        function czyJestModem(login) {
            if (!login) return false;
            return login.trim().toLowerCase() === 'kacperpros45';
        }

        function obliczPunktyZaPoziom(index) {
            const punkty = 250 - (index * 2.5);
            return Math.max(0, Number(punkty.toFixed(1)));
        }

        async function edytujPozycjePoziomu(index, kategoria = 'level') {
            const lista = kategoria === 'challenge' ? pobierzChallenge() : pobierzPoziomy();
            const nazwaListy = kategoria === 'challenge' ? 'Challenge List' : 'Demon List';
            const nowaPozycja = prompt(`Aktualna pozycja w ${nazwaListy}: ${index + 1}. Podaj nową pozycję (1-${lista.length}):`);
            if (nowaPozycja === null) return;
            
            let n = parseInt(nowaPozycja) - 1;
            if (isNaN(n) || n < 0 || n >= lista.length) {
                alert("Niepoprawna pozycja!");
                return;
            }

            const [element] = lista.splice(index, 1);
            lista.splice(n, 0, element);
            
            if (kategoria === 'challenge') {
                await zapiszChallenge(lista);
            } else {
                await zapiszPoziomy(lista);
            }
            zmienStrone('panel_moda');
        }

        function odswiezMenu() {
            const zalogowany = pobierzZalogowanego();
            const nav = document.getElementById('nav-menu');
            
            let html = `
                <a onclick="zmienStrone('home')">Strona główna</a>
                <a onclick="zmienStrone('lista')">Listy</a>
                <a onclick="zmienStrone('leaderboard')">Leaderboard</a>
            `;

            if (zalogowany) {
                let modBadge = czyJestModem(zalogowany) ? '<span class="badge-mod">MOD</span>' : '';
                html += `
                    <a onclick="zmienStrone('dodaj')">Zgłoś poziom</a>
                    <a onclick="zmienStrone('zglos_rekord')">Zgłoś rekord</a>
                `;
                
                if (czyJestModem(zalogowany)) {
                    html += `<a onclick="zmienStrone('panel_moda')" style="color:#ffa502; font-weight:bold;">🛡️ Panel Moda</a>`;
                }

                html += `
                    <span class="user-info">👤 ${zalogowany} ${modBadge}</span>
                    <a onclick="wyloguj()" style="color:#ff4757;">Wyloguj</a>
                `;
            } else {
                html += `
                    <a onclick="zmienStrone('login')">Logowanie</a>
                    <a onclick="zmienStrone('rejestracja')">Rejestracja</a>
                `;
            }

            nav.innerHTML = html;
        }

        async function wyloguj() {
            await ustawZalogowanego('');
            zmienStrone('home');
        }

        function zmienStrone(typ, extraParam = null) {
            const main = document.getElementById('zawartosc');
            odswiezMenu();
            const zalogowany = pobierzZalogowanego();
            const jestModem = czyJestModem(zalogowany);
            
            if (typ === 'home') {
                main.innerHTML = `
                    <h1>Rynxo Fandom Demon List</h1>
                    <p>Oficjalny ranking poziomów i wyzwań zsynchronizowany w chmurze! Zgłaszaj poziomy, przechodź je i zdobywaj punkty.</p>
                `;
            } else if (typ === 'lista') {
                const aktywnaKategoria = extraParam === 'challenge' ? 'challenge' : 'level';
                const poziomy = aktywnaKategoria === 'challenge' ? pobierzChallenge() : pobierzPoziomy();
                
                let listaHtml = poziomy.length === 0 ? `<p>Brak zatwierdzonych pozycji w tej kategorii.</p>` : '<div class="level-list" style="width:100%">';
                
                poziomy.forEach((lvl, index) => {
                    let modActions = jestModem ? `
                        <button class="btn-reject" onclick="usunZatwierdzonyPoziomLista(${index}, '${aktywnaKategoria}')" style="padding: 8px 12px; font-size: 0.9rem;">Usuń</button>
                    ` : '';

                    const punktyZaLvl = obliczPunktyZaPoziom(index);

                    listaHtml += `
                        <div class="level-card">
                            <div style="display: flex; align-items: center; width: 100%; justify-content: space-between;">
                                <div style="display: flex; align-items: center;">
                                    <div class="level-pos">#${index + 1}</div>
                                    <div class="level-info" style="text-align:left;">
                                        <h3 class="clickable-level" onclick="zmienStrone('szczegoly_poziomu', '${encodeURIComponent(lvl.nazwa)}')">${lvl.nazwa} <span style="font-size:0.8rem; color:#aaa;">(ID: ${lvl.id})</span></h3>
                                        <span>Zweryfikował: ${lvl.autor} | <a href="${lvl.nagranie}" target="_blank">${lvl.nagranie}</a></span>
                                        <span style="color: #2ed573; font-weight: bold; margin-top: 4px;">+${punktyZaLvl} pkt</span>
                                    </div>
                                </div>
                                <div>${modActions}</div>
                            </div>
                        </div>
                    `;
                });
                if (poziomy.length > 0) listaHtml += '</div>';

                main.innerHTML = `
                    <h1>Listy poziomów</h1>
                    <div class="tabs-container">
                        <button class="tab-btn ${aktywnaKategoria === 'level' ? 'active' : ''}" onclick="zmienStrone('lista', 'level')">Demon List</button>
                        <button class="tab-btn ${aktywnaKategoria === 'challenge' ? 'active' : ''}" onclick="zmienStrone('lista', 'challenge')">Challenge List</button>
                    </div>
                    <p>Wybierz kategorię i kliknij na nazwę, aby zobaczyć szczegóły oraz rekordy.</p>
                    ${listaHtml}
                `;
            } else if (typ === 'szczegoly_poziomu') {
                const nazwaPoziomu = decodeURIComponent(extraParam);
                const poziomy = pobierzPoziomy();
                const challenge = pobierzChallenge();
                
                const isChallenge = challenge.some(c => c.nazwa.toLowerCase() === nazwaPoziomu.toLowerCase());
                const listaAktualna = isChallenge ? challenge : poziomy;
                const indexPoziomu = listaAktualna.findIndex(l => l.nazwa.toLowerCase() === nazwaPoziomu.toLowerCase());
                
                const lvlObj = indexPoziomu !== -1 ? listaAktualna[indexPoziomu] : null;
                const punktyZaTenPoziom = indexPoziomu !== -1 ? obliczPunktyZaPoziom(indexPoziomu) : 250;
                
                const ukoczenia = isChallenge ? pobierzChallengeRekordy().filter(r => r.poziom.toLowerCase() === nazwaPoziomu.toLowerCase()) : pobierzRekordy().filter(r => r.poziom.toLowerCase() === nazwaPoziomu.toLowerCase());

                let listaUkonczonychHtml = ukoczenia.length === 0 ? '<p>Nikt jeszcze nie ukończył tego poziomu.</p>' : '<div class="level-list" style="width:100%">';
                
                ukoczenia.forEach(rec => {
                    let modTag = czyJestModem(rec.gracz) ? '<span class="badge-mod">MOD</span>' : '';
                    listaUkonczonychHtml += `
                        <div class="level-card">
                            <div class="level-info" style="text-align: left; width: 100%; display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <h3 class="clickable-level" onclick="zmienStrone('profil', '${rec.gracz}')">${rec.gracz} ${modTag}</h3>
                                    <span><a href="${rec.url}" target="_blank">${rec.url}</a></span>
                                </div>
                            </div>
                        </div>
                    `;
                });
                if (ukoczenia.length > 0) listaUkonczonychHtml += '</div>';

                main.innerHTML = `
                    <div class="profile-box">
                        <div class="level-points-badge">+${punktyZaTenPoziom} pkt</div>
                        <h2>${lvlObj ? lvlObj.nazwa : nazwaPoziomu}</h2>
                        <span style="color: #aaa; font-size: 0.95rem; display: block; margin-top: -5px; margin-bottom: 15px;">Zweryfikował: ${lvlObj ? lvlObj.autor : 'Nieznany'}</span>
                        <div class="profile-stats">
                            <div class="profile-stats-row">
                                <div class="stat-card">
                                    <span>ID Poziomu</span>
                                    <strong>${lvlObj ? lvlObj.id : 'Brak'}</strong>
                                </div>
                                <div class="stat-card">
                                    <span>Liczba ukończeń</span>
                                    <strong>${ukoczenia.length} graczy</strong>
                                </div>
                            </div>
                        </div>
                    </div>
                    <h3 style="color:#fff; text-align:left; width:100%; margin-top:10px;">Gracze, którzy ukończyli ten poziom:</h3>
                    ${listaUkonczonychHtml}
                    <button onclick="zmienStrone('lista')" style="margin-top:20px; width:100%;">Powrót do listy</button>
                `;
            } else if (typ === 'leaderboard') {
                const aktywnaKategoria = extraParam === 'challenge' ? 'challenge' : 'level';
                const rekordy = aktywnaKategoria === 'challenge' ? pobierzChallengeRekordy() : pobierzRekordy();
                const listaPoziomow = aktywnaKategoria === 'challenge' ? pobierzChallenge() : pobierzPoziomy();
                
                let allNames = new Set();
                pobierzUzytkownikow().forEach(u => allNames.add(u.login));
                pobierzRekordy().forEach(r => allNames.add(r.gracz));
                pobierzChallengeRekordy().forEach(r => allNames.add(r.gracz));
                allNames.add('kacperpros45');

                let punkty = {};
                allNames.forEach(login => { punkty[login] = 0; });
                
                rekordy.forEach(rec => {
                    const idx = listaPoziomow.findIndex(l => l.nazwa.toLowerCase() === rec.poziom.toLowerCase());
                    const pktZaLvl = idx !== -1 ? obliczPunktyZaPoziom(idx) : 0;
                    if (punkty[rec.gracz] !== undefined) {
                        punkty[rec.gracz] += pktZaLvl;
                    } else {
                        punkty[rec.gracz] = pktZaLvl;
                    }
                });

                let ranking = Object.keys(punkty)
                    .map(login => ({ login, punkty: Number(punkty[login].toFixed(1)) }))
                    .sort((a, b) => b.punkty - a.punkty);

                let rankingHtml = ranking.length === 0 ? '<p>Brak graczy w bazie.</p>' : '<div class="level-list" style="width:100%">';
                ranking.forEach((gracz, index) => {
                    let modTag = czyJestModem(gracz.login) ? '<span class="badge-mod">MOD</span>' : '';
                    rankingHtml += `
                        <div class="ranking-card" onclick="zmienStrone('profil', '${gracz.login}')">
                            <div style="display: flex; align-items: center; gap: 15px; width: 100%;">
                                <div class="level-pos">#${index + 1}</div>
                                <div class="level-info" style="flex: 1; text-align:left;">
                                    <h3>${gracz.login} ${modTag}</h3>
                                    <span>Punkty: ${gracz.punkty} pkt</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
                if (ranking.length > 0) rankingHtml += '</div>';

                main.innerHTML = `
                    <h1>Leaderboard</h1>
                    <div class="tabs-container">
                        <button class="tab-btn ${aktywnaKategoria === 'level' ? 'active' : ''}" onclick="zmienStrone('leaderboard', 'level')">Demon List</button>
                        <button class="tab-btn ${aktywnaKategoria === 'challenge' ? 'active' : ''}" onclick="zmienStrone('leaderboard', 'challenge')">Challenge List</button>
                    </div>
                    <p>Wybierz kategorię i kliknij na gracza, aby zobaczyć jego profil.</p>
                    ${rankingHtml}
                `;
            } else if (typ === 'profil') {
                const nazwaGracza = extraParam;
                const rekordyDemon = pobierzRekordy();
                const rekordyChallenge = pobierzChallengeRekordy();
                const poziomy = pobierzPoziomy();
                const challenge = pobierzChallenge();

                const graczDemonRec = rekordyDemon.filter(r => r.gracz.toLowerCase() === nazwaGracza.toLowerCase());
                const graczChalRec = rekordyChallenge.filter(r => r.gracz.toLowerCase() === nazwaGracza.toLowerCase());

                let punktyDemon = 0;
                graczDemonRec.forEach(rec => {
                    const idx = poziomy.findIndex(l => l.nazwa.toLowerCase() === rec.poziom.toLowerCase());
                    if (idx !== -1) punktyDemon += obliczPunktyZaPoziom(idx);
                });

                let punktyChallenge = 0;
                graczChalRec.forEach(rec => {
                    const idx = challenge.findIndex(c => c.nazwa.toLowerCase() === rec.poziom.toLowerCase());
                    if (idx !== -1) punktyChallenge += obliczPunktyZaPoziom(idx);
                });

                let hardestDemon = "Brak";
                let najnizszyIdxDemon = 999999;
                graczDemonRec.forEach(rec => {
                    const idx = poziomy.findIndex(l => l.nazwa.toLowerCase() === rec.poziom.toLowerCase());
                    if (idx !== -1 && idx < najnizszyIdxDemon) {
                        najnizszyIdxDemon = idx;
                        hardestDemon = `#${idx + 1} - ${poziomy[idx].nazwa}`;
                    }
                });

                let hardestChallenge = "Brak";
                let najnizszyIdxChal = 999999;
                graczChalRec.forEach(rec => {
                    const idx = challenge.findIndex(c => c.nazwa.toLowerCase() === rec.poziom.toLowerCase());
                    if (idx !== -1 && idx < najnizszyIdxChal) {
                        najnizszyIdxChal = idx;
                        hardestChallenge = `#${idx + 1} - ${challenge[idx].nazwa}`;
                    }
                });

                let modTag = czyJestModem(nazwaGracza) ? '<span class="badge-mod">MOD</span>' : '';

                let historiaDemonHtml = graczDemonRec.length === 0 ? '<p>Brak ukończonych poziomów Demon List.</p>' : '<div class="level-list" style="width:100%">';
                graczDemonRec.forEach((rec) => {
                    const idx = poziomy.findIndex(l => l.nazwa.toLowerCase() === rec.poziom.toLowerCase());
                    let posText = idx !== -1 ? `(#${idx + 1} - +${obliczPunktyZaPoziom(idx)} pkt)` : '';
                    let usunPrzycisk = jestModem ? `<button class="btn-reject" onclick="usunZatwierdzonyRekordPrzezProfil('${rec.poziom}', '${rec.gracz}', 'level')" style="padding: 6px 12px; font-size: 0.85rem;">Usuń</button>` : '';

                    historiaDemonHtml += `
                        <div class="level-card">
                            <div class="level-info" style="text-align: left; width: 100%; display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <h3 class="clickable-level" onclick="zmienStrone('szczegoly_poziomu', '${encodeURIComponent(rec.poziom)}')">${rec.poziom} ${posText}</h3>
                                    <span><a href="${rec.url}" target="_blank">${rec.url}</a></span>
                                </div>
                                <div>${usunPrzycisk}</div>
                            </div>
                        </div>
                    `;
                });
                if (graczDemonRec.length > 0) historiaDemonHtml += '</div>';

                let historiaChallengeHtml = graczChalRec.length === 0 ? '<p>Brak ukończonych poziomów Challenge List.</p>' : '<div class="level-list" style="width:100%">';
                graczChalRec.forEach((rec) => {
                    let usunPrzycisk = jestModem ? `<button class="btn-reject" onclick="usunZatwierdzonyRekordPrzezProfil('${rec.poziom}', '${rec.gracz}', 'challenge')" style="padding: 6px 12px; font-size: 0.85rem;">Usuń</button>` : '';

                    historiaChallengeHtml += `
                        <div class="level-card">
                            <div class="level-info" style="text-align: left; width: 100%; display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <h3 class="clickable-level" onclick="zmienStrone('szczegoly_poziomu', '${encodeURIComponent(rec.poziom)}')">${rec.poziom}</h3>
                                    <span><a href="${rec.url}" target="_blank">${rec.url}</a></span>
                                </div>
                                <div>${usunPrzycisk}</div>
                            </div>
                        </div>
                    `;
                });
                if (graczChalRec.length > 0) historiaChallengeHtml += '</div>';

                main.innerHTML = `
                    <div class="profile-box">
                        <h2>Profil gracza: ${nazwaGracza} ${modTag}</h2>
                        <div class="profile-stats">
                            <div class="profile-stats-row">
                                <div class="stat-card">
                                    <span>Punkty Demon List</span>
                                    <strong>${Number(punktyDemon.toFixed(1))} pkt</strong>
                                </div>
                                <div class="stat-card">
                                    <span>Punkty Challenge List</span>
                                    <strong>${Number(punktyChallenge.toFixed(1))} pkt</strong>
                                </div>
                                <div class="stat-card">
                                    <span>Hardest (Demon)</span>
                                    <strong>${hardestDemon}</strong>
                                </div>
                            </div>
                            <div class="profile-stats-row">
                                <div class="stat-card-full">
                                    <span>Hardest (Challenge)</span>
                                    <strong>${hardestChallenge}</strong>
                                </div>
                            </div>
                        </div>
                    </div>
                    <h3 style="color:#fff; text-align:left; width:100%; margin-top:10px;">Ukończone (Demon List):</h3>
                    ${historiaDemonHtml}
                    <h3 style="color:#fff; text-align:left; width:100%; margin-top:20px;">Ukończone (Challenge List):</h3>
                    ${historiaChallengeHtml}
                    <button onclick="zmienStrone('leaderboard')" style="margin-top:25px; width:100%;">Powrót do Leaderboardu</button>
                `;
            } else if (typ === 'login') {
                main.innerHTML = `
                    <h1>Logowanie</h1>
                    <div class="form-box">
                        <input type="text" id="log-login" placeholder="Nazwa użytkownika">
                        <input type="password" id="log-pass" placeholder="Hasło">
                        <div id="log-error" class="error-msg"></div>
                        <button onclick="zaloguj()">Zaloguj się</button>
                    </div>
                `;
            } else if (typ === 'rejestracja') {
                main.innerHTML = `
                    <h1>Rejestracja konta</h1>
                    <div class="form-box">
                        <input type="text" id="reg-login" placeholder="Nazwa użytkownika">
                        <input type="password" id="reg-pass" placeholder="Hasło">
                        <div id="reg-error" class="error-msg"></div>
                        <button onclick="zarejestruj()">Utwórz konto</button>
                    </div>
                `;
            } else if (typ === 'dodaj') {
                if (!zalogowany) { zmienStrone('login'); return; }
                main.innerHTML = `
                    <h1>Zgłoś poziom</h1>
                    <div class="form-box">
                        <select id="lvl-kategoria"><option value="level">Demon List</option><option value="challenge">Challenge List</option></select>
                        <input type="text" id="lvl-name" placeholder="Nazwa poziomu">
                        <input type="text" id="lvl-id" placeholder="ID poziomu">
                        <input type="text" id="lvl-nagranie" placeholder="Link do nagrania z weryfikacji (URL)">
                        <input type="number" id="lvl-pozycja" placeholder="Proponowana pozycja">
                        <div id="lvl-error" class="error-msg"></div>
                        <button onclick="wyslijZgłoszenie()">Wyślij zgłoszenie</button>
                    </div>
                `;
            } else if (typ === 'zglos_rekord') {
                if (!zalogowany) { zmienStrone('login'); return; }
                main.innerHTML = `
                    <h1>Zgłoś rekord</h1>
                    <div class="form-box">
                        <select id="rec-kategoria" onchange="aktualizujListePoziomowRekordu()">
                            <option value="level">Demon List</option>
                            <option value="challenge">Challenge List</option>
                        </select>
                        <select id="rec-level"><option value="">Wybierz poziom...</option></select>
                        <input type="text" id="rec-url" placeholder="Link do dowodu (URL)">
                        <div id="rec-error" class="error-msg"></div>
                        <button onclick="wyslijRekord()">Wyślij rekord</button>
                    </div>
                `;
                aktualizujListePoziomowRekordu();
            } else if (typ === 'panel_moda') {
                if (!jestModem) { zmienStrone('home'); return; }
                const oczekujace = pobierzOczekujace();
                const oczekujaceChallenge = pobierzOczekujaceChallenge();
                const oczekujaceRekordy = pobierzOczekujaceRekordy();
                const oczekujaceChallengeRekordy = pobierzOczekujaceChallengeRekordy();
                const zatwierdzonePoziomy = pobierzPoziomy();
                const zatwierdzoneChallenge = pobierzChallenge();

                let pendingHtml = oczekujace.length === 0 ? '<p>Brak oczekujących zgłoszeń Demon.</p>' : '<div class="level-list" style="width:100%">';
                oczekujace.forEach((lvl, index) => {
                    pendingHtml += `<div class="level-card"><div class="level-info" style="text-align:left;"><h3>${lvl.nazwa}</h3><span>Poz: #${lvl.pozycja} | Autor: ${lvl.autor}</span></div><div style="display:flex; gap:10px;"><button class="btn-accept" onclick="akceptujZgłoszenie(${index}, 'level')">Akceptuj</button><button class="btn-reject" onclick="odrzucZgłoszenie(${index}, 'level')">Odrzuć</button></div></div>`;
                });
                if (oczekujace.length > 0) pendingHtml += '</div>';

                let pendingChalHtml = oczekujaceChallenge.length === 0 ? '<p>Brak oczekujących zgłoszeń Challenge.</p>' : '<div class="level-list" style="width:100%">';
                oczekujaceChallenge.forEach((lvl, index) => {
                    pendingChalHtml += `<div class="level-card"><div class="level-info" style="text-align:left;"><h3>${lvl.nazwa}</h3><span>Poz: #${lvl.pozycja} | Autor: ${lvl.autor}</span></div><div style="display:flex; gap:10px;"><button class="btn-accept" onclick="akceptujZgłoszenie(${index}, 'challenge')">Akceptuj</button><button class="btn-reject" onclick="odrzucZgłoszenie(${index}, 'challenge')">Odrzuć</button></div></div>`;
                });
                if (oczekujaceChallenge.length > 0) pendingChalHtml += '</div>';

                let pendingRecHtml = oczekujaceRekordy.length === 0 ? '<p>Brak oczekujących rekordów Demon.</p>' : '<div class="level-list" style="width:100%">';
                oczekujaceRekordy.forEach((rec, index) => {
                    pendingRecHtml += `<div class="level-card"><div class="level-info" style="text-align:left;"><h3>${rec.poziom}</h3><span>Gracz: ${rec.gracz}</span></div><div style="display:flex; gap:10px;"><button class="btn-accept" onclick="akceptujRekord(${index}, 'level')">Akceptuj</button><button class="btn-reject" onclick="odrzucRekord(${index}, 'level')">Odrzuć</button></div></div>`;
                });
                if (oczekujaceRekordy.length > 0) pendingRecHtml += '</div>';

                let pendingChalRecHtml = oczekujaceChallengeRekordy.length === 0 ? '<p>Brak oczekujących rekordów Challenge.</p>' : '<div class="level-list" style="width:100%">';
                oczekujaceChallengeRekordy.forEach((rec, index) => {
                    pendingChalRecHtml += `<div class="level-card"><div class="level-info" style="text-align:left;"><h3>${rec.poziom}</h3><span>Gracz: ${rec.gracz}</span></div><div style="display:flex; gap:10px;"><button class="btn-accept" onclick="akceptujRekord(${index}, 'challenge')">Akceptuj</button><button class="btn-reject" onclick="odrzucRekord(${index}, 'challenge')">Odrzuć</button></div></div>`;
                });
                if (oczekujaceChallengeRekordy.length > 0) pendingChalRecHtml += '</div>';

                let activeLevelsHtml = zatwierdzonePoziomy.length === 0 ? '<p>Brak poziomów.</p>' : '<div class="level-list" style="width:100%">';
                zatwierdzonePoziomy.forEach((lvl, index) => {
                    activeLevelsHtml += `<div class="level-card"><div class="level-info" style="text-align:left;"><h3>#${index + 1} - ${lvl.nazwa}</h3></div><div style="display:flex; gap:10px;"><button class="btn-accept" onclick="edytujPozycjePoziomu(${index}, 'level')">Edytuj poz.</button><button class="btn-reject" onclick="usunZatwierdzonyPoziom(${index}, 'level')">Usuń</button></div></div>`;
                });
                if (zatwierdzonePoziomy.length > 0) activeLevelsHtml += '</div>';

                main.innerHTML = `
                    <h1>Panel Moderatora</h1>
                    <h3 style="margin-top:20px; color:#fff; text-align:left; width:100%;">Oczekujące poziomy (Demon):</h3>${pendingHtml}
                    <h3 style="margin-top:20px; color:#fff; text-align:left; width:100%;">Oczekujące poziomy (Challenge):</h3>${pendingChalHtml}
                    <h3 style="margin-top:20px; color:#fff; text-align:left; width:100%;">Oczekujące rekordy (Demon):</h3>${pendingRecHtml}
                    <h3 style="margin-top:20px; color:#fff; text-align:left; width:100%;">Oczekujące rekordy (Challenge):</h3>${pendingChalRecHtml}
                    <h3 style="margin-top:30px; color:#ff4757; text-align:left; width:100%;">Zarządzaj Demon List:</h3>${activeLevelsHtml}
                `;
            }
        }

        function aktualizujListePoziomowRekordu() {
            const kategoria = document.getElementById('rec-kategoria').value;
            const selectPoziom = document.getElementById('rec-level');
            if (!selectPoziom) return;
            const poziomy = kategoria === 'challenge' ? pobierzChallenge() : pobierzPoziomy();
            let opcje = '<option value="">Wybierz poziom...</option>';
            poziomy.forEach(lvl => { opcje += `<option value="${lvl.nazwa}">${lvl.nazwa}</option>`; });
            selectPoziom.innerHTML = opcje;
        }

        async function zarejestruj() {
            const login = document.getElementById('reg-login').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();
            const err = document.getElementById('reg-error');
            if (!login || !pass) { err.innerText = "Wypełnij pola!"; return; }
            let users = pobierzUzytkownikow();
            if (users.some(u => u.login.toLowerCase() === login.toLowerCase())) { err.innerText = "Użytkownik istnieje!"; return; }
            users.push({ login, pass });
            await zapiszUzytkownikow(users);
            await ustawZalogowanego(login);
            zmienStrone('home');
        }

        async function zaloguj() {
            const login = document.getElementById('log-login').value.trim();
            const pass = document.getElementById('log-pass').value.trim();
            const err = document.getElementById('log-error');
            let users = pobierzUzytkownikow();
            const user = users.find(u => u.login.toLowerCase() === login.toLowerCase() && u.pass === pass);
            if (!user && login.toLowerCase() !== 'kacperpros45') { err.innerText = "Błędny login lub hasło!"; return; }
            await ustawZalogowanego(login);
            zmienStrone('home');
        }

        async function wyslijZgłoszenie() {
            const kategoria = document.getElementById('lvl-kategoria').value;
            const nazwa = document.getElementById('lvl-name').value.trim();
            const id = document.getElementById('lvl-id').value.trim();
            const nagranie = document.getElementById('lvl-nagranie').value.trim();
            const pozycja = parseInt(document.getElementById('lvl-pozycja').value);
            const err = document.getElementById('lvl-error');
            const autor = pobierzZalogowanego();
            if (!nazwa || !id || !nagranie || isNaN(pozycja)) { err.innerText = "Uzupełnij pola!"; return; }
            if (kategoria === 'challenge') {
                let p = pobierzOczekujaceChallenge(); p.push({ nazwa, id, nagranie, pozycja, autor }); await zapiszOczekujaceChallenge(p);
            } else {
                let p = pobierzOczekujace(); p.push({ nazwa, id, nagranie, pozycja, autor }); await zapiszOczekujace(p);
            }
            alert("Wysłano zgłoszenie!");
            zmienStrone('lista', kategoria);
        }

        async function wyslijRekord() {
            const kategoria = document.getElementById('rec-kategoria').value;
            const poziom = document.getElementById('rec-level').value;
            const url = document.getElementById('rec-url').value.trim();
            const err = document.getElementById('rec-error');
            const gracz = pobierzZalogowanego();
            if (!poziom || !url) { err.innerText = "Wybierz poziom i podaj URL!"; return; }
            if (kategoria === 'challenge') {
                let r = pobierzOczekujaceChallengeRekordy(); r.push({ poziom, url, gracz }); await zapiszOczekujaceChallengeRekordy(r);
            } else {
                let r = pobierzOczekujaceRekordy(); r.push({ poziom, url, gracz }); await zapiszOczekujaceRekordy(r);
            }
            alert("Wysłano rekord!");
            zmienStrone('leaderboard', kategoria);
        }

        async function akceptujZgłoszenie(index, kategoria = 'level') {
            if (kategoria === 'challenge') {
                let o = pobierzOczekujaceChallenge(); let l = pobierzChallenge(); let r = pobierzChallengeRekordy();
                let zatwierdzony = o.splice(index, 1)[0];
                l.splice(zatwierdzony.pozycja - 1, 0, zatwierdzony);
                r.push({ poziom: zatwierdzony.nazwa, url: zatwierdzony.nagranie, gracz: zatwierdzony.autor });
                await zapiszOczekujaceChallenge(o); await zapiszChallenge(l); await zapiszChallengeRekordy(r);
            } else {
                let o = pobierzOczekujace(); let l = pobierzPoziomy(); let r = pobierzRekordy();
                let zatwierdzony = o.splice(index, 1)[0];
                l.splice(zatwierdzony.pozycja - 1, 0, zatwierdzony);
                r.push({ poziom: zatwierdzony.nazwa, url: zatwierdzony.nagranie, gracz: zatwierdzony.autor });
                await zapiszOczekujace(o); await zapiszPoziomy(l); await zapiszRekordy(r);
            }
            zmienStrone('panel_moda');
        }

        async function odrzucZgłoszenie(index, kategoria = 'level') {
            if (kategoria === 'challenge') {
                let o = pobierzOczekujaceChallenge(); o.splice(index, 1); await zapiszOczekujaceChallenge(o);
            } else {
                let o = pobierzOczekujace(); o.splice(index, 1); await zapiszOczekujace(o);
            }
            zmienStrone('panel_moda');
        }

        async function akceptujRekord(index, kategoria = 'level') {
            if (kategoria === 'challenge') {
                let o = pobierzOczekujaceChallengeRekordy(); let r = pobierzChallengeRekordy();
                r.push(o.splice(index, 1)[0]);
                await zapiszOczekujaceChallengeRekordy(o); await zapiszChallengeRekordy(r);
            } else {
                let o = pobierzOczekujaceRekordy(); let r = pobierzRekordy();
                r.push(o.splice(index, 1)[0]);
                await zapiszOczekujaceRekordy(o); await zapiszRekordy(r);
            }
            zmienStrone('panel_moda');
        }

        async function odrzucRekord(index, kategoria = 'level') {
            if (kategoria === 'challenge') {
                let o = pobierzOczekujaceChallengeRekordy(); o.splice(index, 1); await zapiszOczekujaceChallengeRekordy(o);
            } else {
                let o = pobierzOczekujaceRekordy(); o.splice(index, 1); await zapiszOczekujaceRekordy(o);
            }
            zmienStrone('panel_moda');
        }

        async function usunZatwierdzonyPoziom(index, kategoria = 'level') {
            if (confirm("Usunąć poziom?")) {
                if (kategoria === 'challenge') {
                    let l = pobierzChallenge(); l.splice(index, 1); await zapiszChallenge(l);
                } else {
                    let l = pobierzPoziomy(); l.splice(index, 1); await zapiszPoziomy(l);
                }
                zmienStrone('panel_moda');
            }
        }

        async function usunZatwierdzonyPoziomLista(index, kategoria = 'level') {
            if (confirm("Usunąć poziom?")) {
                if (kategoria === 'challenge') {
                    let l = pobierzChallenge(); l.splice(index, 1); await zapiszChallenge(l);
                } else {
                    let l = pobierzPoziomy(); l.splice(index, 1); await zapiszPoziomy(l);
                }
                zmienStrone('lista', kategoria);
            }
        }

        async function usunZatwierdzonyRekordPrzezProfil(poziomNazwa, graczNazwa, kategoria = 'level') {
            if (confirm("Usunąć ten rekord?")) {
                if (kategoria === 'challenge') {
                    let r = pobierzChallengeRekordy();
                    let idx = r.findIndex(x => x.poziom.toLowerCase() === poziomNazwa.toLowerCase() && x.gracz.toLowerCase() === graczNazwa.toLowerCase());
                    if (idx !== -1) { r.splice(idx, 1); await zapiszChallengeRekordy(r); }
                } else {
                    let r = pobierzRekordy();
                    let idx = r.findIndex(x => x.poziom.toLowerCase() === poziomNazwa.toLowerCase() && x.gracz.toLowerCase() === graczNazwa.toLowerCase());
                    if (idx !== -1) { r.splice(idx, 1); await zapiszRekordy(r); }
                }
                zmienStrone('profil', graczNazwa);
            }
        }

        wczytajDaneZServera();
    </script>
</body>
</html>
