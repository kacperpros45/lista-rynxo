<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rynxo Fandom Demon List (RFDL)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #1f1f1f;
            border-bottom: 2px solid #333;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff4757;
            letter-spacing: 1px;
            cursor: pointer;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        nav a, nav span {
            color: #aaa;
            text-decoration: none;
            transition: color 0.2s;
            cursor: pointer;
            font-size: 0.95rem;
            white-space: nowrap;
        }

        nav a:hover, nav span:hover {
            color: #fff;
        }

        .user-info {
            color: #ff4757;
            font-weight: bold;
        }

        .badge-mod {
            background: #ffa502;
            color: #121212;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-left: 5px;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #fff;
        }

        p {
            color: #777;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .form-box {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #333;
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: left;
        }

        input, select, textarea {
            padding: 12px;
            background: #121212;
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
            font-size: 1rem;
            resize: vertical;
        }

        button {
            padding: 12px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #ff6b81;
        }

        button.btn-accept {
            background: #2ed573;
            padding: 8px 14px;
            font-size: 0.9rem;
        }
        button.btn-accept:hover {
            background: #26af5f;
        }

        button.btn-reject {
            background: #ff4757;
            padding: 8px 14px;
            font-size: 0.9rem;
        }
        button.btn-reject:hover {
            background: #ff6b81;
        }

        .level-list, .ranking-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .level-card, .ranking-card {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 15px 20px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            width: 100%;
        }

        .ranking-card {
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .ranking-card:hover {
            border-color: #ff4757;
        }

        .clickable-level {
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .clickable-level:hover {
            color: #ff4757;
            text-decoration: underline;
        }

        .level-info span {
            color: #888;
            font-size: 0.9rem;
            display: block;
            margin-top: 3px;
        }

        .level-info a {
            color: #ff4757;
            text-decoration: none;
        }

        .level-info a:hover {
            text-decoration: underline;
        }

        .level-pos {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff4757;
            margin-right: 20px;
            min-width: 40px;
        }

        .profile-box {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 25px;
            border-radius: 8px;
            width: 100%;
            text-align: left;
            margin-bottom: 20px;
        }

        .profile-box h2 {
            color: #fff;
            margin-bottom: 10px;
        }

        .profile-stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: #121212;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #222;
            flex: 1;
            min-width: 180px;
        }

        .stat-card span {
            color: #777;
            font-size: 0.85rem;
            display: block;
        }

        .stat-card strong {
            color: #ff4757;
            font-size: 1.3rem;
        }

        footer {
            background-color: #1f1f1f;
            text-align: center;
            padding: 15px;
            font-size: 0.9rem;
            color: #555;
            border-top: 1px solid #222;
        }

        .error-msg {
            color: #ff4757;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="zmienStrone('home')">RFDL</div>
        <nav id="nav-menu"></nav>
    </header>

    <main id="zawartosc"></main>

    <footer>
        &copy; 2026 Rynxo Fandom Demon List. Wszelkie prawa zastrzeżone.
    </footer>

    <script>
        if (!localStorage.getItem('rfdl_users')) localStorage.setItem('rfdl_users', JSON.stringify([]));
        if (!localStorage.getItem('rfdl_levels')) localStorage.setItem('rfdl_levels', JSON.stringify([]));
        if (!localStorage.getItem('rfdl_pending')) localStorage.setItem('rfdl_pending', JSON.stringify([]));
        if (!localStorage.getItem('rfdl_records')) localStorage.setItem('rfdl_records', JSON.stringify([]));
        if (!localStorage.getItem('rfdl_pending_records')) localStorage.setItem('rfdl_pending_records', JSON.stringify([]));
        if (!localStorage.getItem('rfdl_current_user')) localStorage.setItem('rfdl_current_user', 'kacperpros45');

        function pobierzUzytkownikow() { return JSON.parse(localStorage.getItem('rfdl_users')); }
        function zapiszUzytkownikow(u) { localStorage.setItem('rfdl_users', JSON.stringify(u)); }
        
        function pobierzPoziomy() { return JSON.parse(localStorage.getItem('rfdl_levels')); }
        function zapiszPoziomy(l) { localStorage.setItem('rfdl_levels', JSON.stringify(l)); }

        function pobierzOczekujace() { return JSON.parse(localStorage.getItem('rfdl_pending')); }
        function zapiszOczekujace(p) { localStorage.setItem('rfdl_pending', JSON.stringify(p)); }

        function pobierzRekordy() { return JSON.parse(localStorage.getItem('rfdl_records')); }
        function zapiszRekordy(r) { localStorage.setItem('rfdl_records', JSON.stringify(r)); }

        function pobierzOczekujaceRekordy() { return JSON.parse(localStorage.getItem('rfdl_pending_records')); }
        function zapiszOczekujaceRekordy(pr) { localStorage.setItem('rfdl_pending_records', JSON.stringify(pr)); }

        function pobierzZalogowanego() { return localStorage.getItem('rfdl_current_user') || ''; }
        function ustawZalogowanego(u) { localStorage.setItem('rfdl_current_user', u); odswiezMenu(); }

        function czyJestModem(login) {
            if (!login) return false;
            return login.trim().toLowerCase() === 'kacperpros45';
        }

        function odswiezMenu() {
            const zalogowany = pobierzZalogowanego();
            const nav = document.getElementById('nav-menu');
            
            let html = `
                <a onclick="zmienStrone('home')">Strona główna</a>
                <a onclick="zmienStrone('lista')">Lista</a>
                <a onclick="zmienStrone('leaderboard')">Leaderboard</a>
            `;

            if (zalogowany) {
                let modBadge = czyJestModem(zalogowany) ? '<span class="badge-mod">MOD</span>' : '';
                html += `
                    <a onclick="zmienStrone('dodaj')">Zgłoś poziom</a>
                    <a onclick="zmienStrone('zglos_rekord')">Zgłoś rekord</a>
                `;
                
                if (czyJestModem(zalogowany)) {
                    html += `<a onclick="zmienStrone('panel_moda')" style="color:#ffa502; font-weight:bold;">🛡️ Panel Moda</a>`;
                }

                html += `
                    <span class="user-info">👤 ${zalogowany} ${modBadge}</span>
                    <a onclick="wyloguj()" style="color:#ff4757;">Wyloguj</a>
                `;
            } else {
                html += `
                    <a onclick="zmienStrone('login')">Logowanie</a>
                    <a onclick="zmienStrone('rejestracja')">Rejestracja</a>
                `;
            }
            
            html += `<a onclick="resetujPamiec()" style="color:#2ed573; font-size:0.85rem;" title="Reset i wymuszenie moda">🔄 Napraw moda</a>`;

            nav.innerHTML = html;
        }

        function resetujPamiec() {
            localStorage.setItem('rfdl_current_user', 'kacperpros45');
            alert("Przywrócono uprawnienia moderatora dla kacperpros45!");
            location.reload();
        }

        function wyloguj() {
            ustawZalogowanego('');
            zmienStrone('home');
        }

        function zmienStrone(typ, extraParam = null) {
            const main = document.getElementById('zawartosc');
            odswiezMenu();
            const zalogowany = pobierzZalogowanego();
            const jestModem = czyJestModem(zalogowany);
            
            if (typ === 'home') {
                main.innerHTML = `
                    <h1>Rynxo Fandom Demon List</h1>
                    <p>Oficjalny ranking poziomów. Zgłaszaj poziomy, przechodź je, zdobywaj punkty i sprawdzaj leaderboard.</p>
                `;
            } else if (typ === 'lista') {
                const poziomy = pobierzPoziomy();
                let listaHtml = poziomy.length === 0 ? '<p>Brak zatwierdzonych poziomów na liście.</p>' : '<div class="level-list">';
                
                poziomy.forEach((lvl, index) => {
                    let modActions = jestModem ? `
                        <button class="btn-reject" onclick="usunZatwierdzonyPoziomLista(${index})" style="padding: 6px 10px; font-size: 0.8rem;">Usuń</button>
                    ` : '';

                    listaHtml += `
                        <div class="level-card">
                            <div style="display: flex; align-items: center; width: 100%; justify-content: space-between;">
                                <div style="display: flex; align-items: center;">
                                    <div class="level-pos">#${index + 1}</div>
                                    <div class="level-info">
                                        <h3 class="clickable-level" onclick="zmienStrone('szczegoly_poziomu', '${encodeURIComponent(lvl.nazwa)}')">${lvl.nazwa} <span style="font-size:0.8rem; color:#aaa;">(ID: ${lvl.id})</span></h3>
                                        <span>Zgłosił: ${lvl.autor} | <a href="${lvl.nagranie}" target="_blank">🔗 Zobacz nagranie</a></span>
                                    </div>
                                </div>
                                <div>${modActions}</div>
                            </div>
                        </div>
                    `;
                });
                if (poziomy.length > 0) listaHtml += '</div>';

                main.innerHTML = `
                    <h1>Lista poziomów</h1>
                    <p>Kliknij na nazwę poziomu, aby zobaczyć szczegóły i listę osób, które go przeszły.</p>
                    ${listaHtml}
                `;
            } else if (typ === 'szczegoly_poziomu') {
                const nazwaPoziomu = decodeURIComponent(extraParam);
                const poziomy = pobierzPoziomy();
                const rekordy = pobierzRekordy();

                const lvlObj = poziomy.find(l => l.nazwa.toLowerCase() === nazwaPoziomu.toLowerCase());
                const ukoczenia = rekordy.filter(r => r.poziom.toLowerCase() === nazwaPoziomu.toLowerCase());

                let listaUkonczonychHtml = ukoczenia.length === 0 ? '<p>Nikt jeszcze nie ukończył tego poziomu.</p>' : '<div class="level-list">';
                
                ukoczenia.forEach(rec => {
                    let modTag = czyJestModem(rec.gracz) ? '<span class="badge-mod">MOD</span>' : '';
                    listaUkonczonychHtml += `
                        <div class="level-card">
                            <div class="level-info" style="text-align: left; width: 100%; display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <h3 class="clickable-level" onclick="zmienStrone('profil', '${rec.gracz}')">${rec.gracz} ${modTag}</h3>
                                    <span><a href="${rec.url}" target="_blank">🔗 Dowód ukończenia (URL)</a></span>
                                </div>
                            </div>
                        </div>
                    `;
                });
                if (ukoczenia.length > 0) listaUkonczonychHtml += '</div>';

                main.innerHTML = `
                    <div class="profile-box">
                        <h2>Poziom: ${lvlObj ? lvlObj.nazwa : nazwaPoziomu}</h2>
                        <div class="profile-stats">
                            <div class="stat-card">
                                <span>ID Poziomu</span>
                                <strong>${lvlObj ? lvlObj.id : 'Brak'}</strong>
                            </div>
                            <div class="stat-card">
                                <span>Liczba ukończeń</span>
                                <strong>${ukoczenia.length} graczy</strong>
                            </div>
                        </div>
                    </div>
                    <h3 style="color:#fff; text-align:left; width:100%; margin-top:10px;">Gracze, którzy ukończyli ten poziom:</h3>
                    ${listaUkonczonychHtml}
                    <button onclick="zmienStrone('lista')" style="margin-top:20px; width:100%;">Powrót do listy</button>
                `;
            } else if (typ === 'leaderboard') {
                const rekordy = pobierzRekordy();
                const users = pobierzUzytkownikow();
                
                let punktyGraczy = { 'kacperpros45': 0 };
                users.forEach(u => punktyGraczy[u.login] = 0);
                
                rekordy.forEach(rec => {
                    if (punktyGraczy[rec.gracz] !== undefined) {
                        punktyGraczy[rec.gracz] += 10;
                    } else {
                        punktyGraczy[rec.gracz] = 10;
                    }
                });

                let ranking = Object.keys(punktyGraczy).map(login => ({
                    login,
                    punkty: punktyGraczy[login]
                })).sort((a, b) => b.punkty - a.punkty);

                let rankHtml = ranking.length === 0 ? '<p>Brak graczy w leaderboardzie.</p>' : '<div class="ranking-list">';
                ranking.forEach((gracz, index) => {
                    let modTag = czyJestModem(gracz.login) ? '<span class="badge-mod">MOD</span>' : '';
                    rankHtml += `
                        <div class="ranking-card" onclick="zmienStrone('profil', '${gracz.login}')">
                            <div style="display: flex; align-items: center; gap: 15px; width: 100%;">
                                <div class="level-pos">#${index + 1}</div>
                                <div class="level-info" style="flex: 1;">
                                    <h3>${gracz.login} ${modTag}</h3>
                                    <span>Punkty: ${gracz.punkty} (Kliknij, aby zobaczyć profil)</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
                if (ranking.length > 0) rankHtml += '</div>';

                main.innerHTML = `
                    <h1>Leaderboard</h1>
                    <p>Kliknij na gracza, aby zobaczyć jego profil, najtrudniejszy ukończony poziom (Hardest) oraz historię.</p>
                    ${rankHtml}
                `;
            } else if (typ === 'profil') {
                const nazwaGracza = extraParam;
                const rekordy = pobierzRekordy();
                const poziomy = pobierzPoziomy();

                const rekordyGracza = rekordy.filter(r => r.gracz.toLowerCase() === nazwaGracza.toLowerCase());
                const punkty = rekordyGracza.length * 10;

                let hardest = "Brak";
                let najnizszyIndex = 999999;

                rekordyGracza.forEach(rec => {
                    const idx = poziomy.findIndex(l => l.nazwa.toLowerCase() === rec.poziom.toLowerCase());
                    if (idx !== -1 && idx < najnizszyIndex) {
                        najnizszyIndex = idx;
                        hardest = `#${idx + 1} - ${poziomy[idx].nazwa}`;
                    }
                });

                let modTag = czyJestModem(nazwaGracza) ? '<span class="badge-mod">MOD</span>' : '';

                let historiaHtml = rekordyGracza.length === 0 ? '<p>Ten gracz nie ukończył jeszcze żadnego poziomu z listy.</p>' : '<div class="level-list">';
                
                rekordyGracza.forEach((rec) => {
                    const globalIndex = rekordy.findIndex(r => r.gracz.toLowerCase() === rec.gracz.toLowerCase() && r.poziom.toLowerCase() === rec.poziom.toLowerCase() && r.url === rec.url);
                    const idx = poziomy.findIndex(l => l.nazwa.toLowerCase() === rec.poziom.toLowerCase());
                    const posText = idx !== -1 ? `(#${idx + 1})` : '';

                    let usunPrzycisk = jestModem ? `<button class="btn-reject" onclick="usunZatwierdzonyRekord(${globalIndex})" style="padding: 5px 10px; font-size: 0.8rem;">Usuń rekord</button>` : '';

                    historiaHtml += `
                        <div class="level-card">
                            <div class="level-info" style="text-align: left; width: 100%; display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <h3 class="clickable-level" onclick="zmienStrone('szczegoly_poziomu', '${encodeURIComponent(rec.poziom)}')">${rec.poziom} ${posText}</h3>
                                    <span><a href="${rec.url}" target="_blank">🔗 Dowód (URL)</a></span>
                                </div>
                                <div>${usunPrzycisk}</div>
                            </div>
                        </div>
                    `;
                });
                if (rekordyGracza.length > 0) historiaHtml += '</div>';

                main.innerHTML = `
                    <div class="profile-box">
                        <h2>Profil gracza: ${nazwaGracza} ${modTag}</h2>
                        <div class="profile-stats">
                            <div class="stat-card">
                                <span>Zdobyte punkty</span>
                                <strong>${punkty} pkt</strong>
                            </div>
                            <div class="stat-card">
                                <span>Najtrudniejszy (Hardest)</span>
                                <strong>${hardest}</strong>
                            </div>
                            <div class="stat-card">
                                <span>Ukończone poziomy</span>
                                <strong>${rekordyGracza.length}</strong>
                            </div>
                        </div>
                    </div>
                    <h3 style="color:#fff; text-align:left; width:100%; margin-top:10px;">Ukończone poziomy:</h3>
                    ${historiaHtml}
                    <button onclick="zmienStrone('leaderboard')" style="margin-top:20px; width:100%;">Powrót do Leaderboardu</button>
                `;
            } else if (typ === 'login') {
                main.innerHTML = `
                    <h1>Logowanie</h1>
                    <div class="form-box">
                        <input type="text" id="log-login" placeholder="Nazwa użytkownika">
                        <input type="password" id="log-pass" placeholder="Hasło">
                        <div id="log-error" class="error-msg"></div>
                        <button onclick="zaloguj()">Zaloguj się</button>
                    </div>
                `;
            } else if (typ === 'rejestracja') {
                main.innerHTML = `
                    <h1>Rejestracja konta</h1>
                    <div class="form-box">
                        <input type="text" id="reg-login" placeholder="Nazwa użytkownika">
                        <input type="password" id="reg-pass" placeholder="Hasło">
                        <div id="reg-error" class="error-msg"></div>
                        <button onclick="zarejestruj()">Utwórz konto</button>
                    </div>
                `;
            } else if (typ === 'dodaj') {
                if (!zalogowany) {
                    zmienStrone('login');
                    return;
                }
                main.innerHTML = `
                    <h1>Zgłoś poziom</h1>
                    <p style="font-size:0.9rem;">Wypełnij dane zgłoszenia. Trafi ono do akceptacji przez moderatora.</p>
                    <div class="form-box">
                        <input type="text" id="lvl-name" placeholder="Nazwa poziomu">
                        <input type="text" id="lvl-id" placeholder="ID poziomu">
                        <input type="text" id="lvl-nagranie" placeholder="Link do nagrania (URL)">
                        <input type="number" id="lvl-pozycja" placeholder="Proponowana pozycja na liście">
                        <div id="lvl-error" class="error-msg"></div>
                        <button onclick="wyslijZgłoszenie()">Wyślij zgłoszenie</button>
                    </div>
                `;
            } else if (typ === 'zglos_rekord') {
                if (!zalogowany) {
                    zmienStrone('login');
                    return;
                }
                const poziomy = pobierzPoziomy();
                let opcjePoziomow = poziomy.length === 0 ? '<option value="">Brak poziomów na liście</option>' : '<option value="">Wybierz poziom...</option>';
                poziomy.forEach(lvl => {
                    opcjePoziomow += `<option value="${lvl.nazwa}">${lvl.nazwa} (ID: ${lvl.id})</option>`;
                });

                main.innerHTML = `
                    <h1>Zgłoś rekord</h1>
                    <p style="font-size:0.9rem;">Przeszukałeś poziom? Prześlij dowód ukończenia!</p>
                    <div class="form-box">
                        <select id="rec-level">
                            ${opcjePoziomow}
                        </select>
                        <input type="text" id="rec-url" placeholder="Link do dowodu / nagrania (URL)">
                        <div id="rec-error" class="error-msg"></div>
                        <button onclick="wyslijRekord()">Wyślij rekord</button>
                    </div>
                `;
            } else if (typ === 'panel_moda') {
                if (!jestModem) {
                    zmienStrone('home');
                    return;
                }
                const oczekujace = pobierzOczekujace();
                const oczekujaceRekordy = pobierzOczekujaceRekordy();
                const zatwierdzonePoziomy = pobierzPoziomy();
                const zatwierdzoneRekordy = pobierzRekordy();

                let pendingHtml = oczekujace.length === 0 ? '<p>Brak oczekujących zgłoszeń poziomów.</p>' : '<div class="level-list">';
                oczekujace.forEach((lvl, index) => {
                    pendingHtml += `
                        <div class="level-card">
                            <div class="level-info" style="text-align: left;">
                                <h3>[Poziom] ${lvl.nazwa} <span style="font-size:0.8rem; color:#aaa;">(ID: ${lvl.id})</span></h3>
                                <span>Proponowana pozycja: #${lvl.pozycja} | Zgłosił: ${lvl.autor}</span>
                                <a href="${lvl.nagranie}" target="_blank">🔗 Zobacz nagranie</a>
                            </div>
                            <div style="display: flex; gap: 10px;">
                                <button class="btn-accept" onclick="akceptujZgłoszenie(${index})">Akceptuj</button>
                                <button class="btn-reject" onclick="odrzucZgłoszenie(${index})">Odrzuć</button>
                            </div>
                        </div>
                    `;
                });
                if (oczekujace.length > 0) pendingHtml += '</div>';

                let pendingRecHtml = oczekujaceRekordy.length === 0 ? '<p>Brak oczekujących zgłoszeń rekordów.</p>' : '<div class="level-list">';
                oczekujaceRekordy.forEach((rec, index) => {
                    pendingRecHtml += `
                        <div class="level-card">
                            <div class="level-info" style="text-align: left;">
                                <h3>[Rekord] Poziom: ${rec.poziom}</h3>
                                <span>Gracz: ${rec.gracz} | <a href="${rec.url}" target="_blank">🔗 Dowód (URL)</a></span>
                            </div>
                            <div style="display: flex; gap: 10px;">
                                <button class="btn-accept" onclick="akceptujRekord(${index})">Akceptuj</button>
                                <button class="btn-reject" onclick="odrzucRekord(${index})">Odrzuć</button>
                            </div>
                        </div>
                    `;
                });
                if (oczekujaceRekordy.length > 0) pendingRecHtml += '</div>';

                let activeLevelsHtml = zatwierdzonePoziomy.length === 0 ? '<p>Brak poziomów na liście.</p>' : '<div class="level-list">';
                zatwierdzonePoziomy.forEach((lvl, index) => {
                    activeLevelsHtml += `
                        <div class="level-card">
                            <div class="level-info" style="text-align: left;">
                                <h3>#${index + 1} - ${lvl.nazwa} (ID: ${lvl.id})</h3>
                            </div>
                            <div>
                                <button class="btn-reject" onclick="usunZatwierdzonyPoziom(${index})">Usuń z listy</button>
                            </div>
                        </div>
                    `;
                });
                if (zatwierdzonePoziomy.length > 0) activeLevelsHtml += '</div>';

                let activeRecordsHtml = zatwierdzoneRekordy.length === 0 ? '<p>Brak zatwierdzonych rekordów (punktów).</p>' : '<div class="level-list">';
                zatwierdzoneRekordy.forEach((rec, index) => {
                    activeRecordsHtml += `
                        <div class="level-card">
                            <div class="level-info" style="text-align: left;">
                                <h3>Gracz: ${rec.gracz}</h3>
                                <span>Poziom: ${rec.poziom} (+10 pkt)</span>
                            </div>
                            <div>
                                <button class="btn-reject" onclick="usunZatwierdzonyRekord(${index})">Usuń rekord (odejmij pkt)</button>
                            </div>
                        </div>
                    `;
                });
                if (zatwierdzoneRekordy.length > 0) activeRecordsHtml += '</div>';

                main.innerHTML = `
                    <h1>Panel Moderatora</h1>
                    <p>Zarządzaj nadesłanymi oraz już opublikowanymi poziomami i rekordami.</p>
                    
                    <h3 style="margin-top:20px; color:#fff; text-align:left; width:100%;">Oczekujące poziomy:</h3>
                    ${pendingHtml}
                    
                    <h3 style="margin-top:30px; color:#fff; text-align:left; width:100%;">Oczekujące rekordy:</h3>
                    ${pendingRecHtml}

                    <h3 style="margin-top:40px; color:#ff4757; text-align:left; width:100%;">Zarządzaj aktywnymi poziomami na liście:</h3>
                    ${activeLevelsHtml}

                    <h3 style="margin-top:30px; color:#ff4757; text-align:left; width:100%;">Zarządzaj zatwierdzonymi rekordami (punktami):</h3>
                    ${activeRecordsHtml}
                `;
            }
        }

        function zarejestruj() {
            const login = document.getElementById('reg-login').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();
            const err = document.getElementById('reg-error');

            if (!login || !pass) {
                err.innerText = "Wypełnij wszystkie pola!";
                return;
            }

            let users = pobierzUzytkownikow();
            if (users.some(u => u.login.toLowerCase() === login.toLowerCase())) {
                err.innerText = "Taki użytkownik już istnieje!";
                return;
            }

            users.push({ login, pass });
            zapiszUzytkownikow(users);
            ustawZalogowanego(login);
            zmienStrone('home');
        }

        function zaloguj() {
            const login = document.getElementById('log-login').value.trim();
            const pass = document.getElementById('log-pass').value.trim();
            const err = document.getElementById('log-error');

            let users = pobierzUzytkownikow();
            const user = users.find(u => u.login.toLowerCase() === login.toLowerCase() && u.pass === pass);

            if (!user && login.toLowerCase() !== 'kacperpros45') {
                err.innerText = "Niepoprawny login lub hasło!";
                return;
            }

            ustawZalogowanego(login);
            zmienStrone('home');
        }

        function wyslijZgłoszenie() {
            const nazwa = document.getElementById('lvl-name').value.trim();
            const id = document.getElementById('lvl-id').value.trim();
            const nagranie = document.getElementById('lvl-nagranie').value.trim();
            const pozycja = parseInt(document.getElementById('lvl-pozycja').value);
            const err = document.getElementById('lvl-error');
            const autor = pobierzZalogowanego();

            if (!nazwa || !id || !nagranie || isNaN(pozycja)) {
                err.innerText = "Wypełnij wszystkie pola poprawnie!";
                return;
            }

            let oczekujace = pobierzOczekujace();
            oczekujace.push({ nazwa, id, nagranie, pozycja, autor });
            zapiszOczekujace(oczekujace);
            
            alert("Zgłoszenie poziomu zostało wysłane do akceptacji!");
            zmienStrone('lista');
        }

        function wyslijRekord() {
            const poziom = document.getElementById('rec-level').value;
            const url = document.getElementById('rec-url').value.trim();
            const err = document.getElementById('rec-error');
            const gracz = pobierzZalogowanego();

            if (!poziom || !url) {
                err.innerText = "Wypełnij wszystkie pola, w tym wybierz poziom!";
                return;
            }

            let oczekujaceRekordy = pobierzOczekujaceRekordy();
            oczekujaceRekordy.push({ poziom, url, gracz });
            zapiszOczekujaceRekordy(oczekujaceRekordy);

            alert("Zgłoszenie rekordu zostało wysłane do akceptacji!");
            zmienStrone('leaderboard');
        }

        function akceptujZgłoszenie(index) {
            let oczekujace = pobierzOczekujace();
            let poziomy = pobierzPoziomy();

            let zatwierdzony = oczekujace.splice(index, 1)[0];
            
            let docelowaPozycja = zatwierdzony.pozycja - 1;
            if (docelowaPozycja < 0) docelowaPozycja = 0;
            if (docelowaPozycja > poziomy.length) {
                poziomy.push(zatwierdzony);
            } else {
                poziomy.splice(docelowaPozycja, 0, zatwierdzony);
            }

            zapiszOczekujace(oczekujace);
            zapiszPoziomy(poziomy);
            zmienStrone('panel_moda');
        }

        function odrzucZgłoszenie(index) {
            let oczekujace = pobierzOczekujace();
            oczekujace.splice(index, 1);
            zapiszOczekujace(oczekujace);
            zmienStrone('panel_moda');
        }

        function akceptujRekord(index) {
            let oczekujaceRekordy = pobierzOczekujaceRekordy();
            let rekordy = pobierzRekordy();

            let zatwierdzonyRec = oczekujaceRekordy.splice(index, 1)[0];
            rekordy.push(zatwierdzonyRec);

            zapiszOczekujaceRekordy(oczekujaceRekordy);
            zapiszRekordy(rekordy);
            zmienStrone('panel_moda');
        }

        function odrzucRekord(index) {
            let oczekujaceRekordy = pobierzOczekujaceRekordy();
            oczekujaceRekordy.splice(index, 1);
            zapiszOczekujaceRekordy(oczekujaceRekordy);
            zmienStrone('panel_moda');
        }

        function usunZatwierdzonyPoziom(index) {
            if (confirm("Czy na pewno chcesz usunąć ten poziom z listy?")) {
                let poziomy = pobierzPoziomy();
                poziomy.splice(index, 1);
                zapiszPoziomy(poziomy);
                zmienStrone('panel_moda');
            }
        }

        function usunZatwierdzonyPoziomLista(index) {
            if (confirm("Czy na pewno chcesz usunąć ten poziom z listy?")) {
                let poziomy = pobierzPoziomy();
                poziomy.splice(index, 1);
                zapiszPoziomy(poziomy);
                zmienStrone('lista');
            }
        }

        function usunZatwierdzonyRekord(index) {
            if (confirm("Czy na pewno chcesz usunąć ten rekord (gracz straci punkty za ten poziom)?")) {
                let rekordy = pobierzRekordy();
                rekordy.splice(index, 1);
                zapiszRekordy(rekordy);
                zmienStrone('panel_moda');
            }
        }

        if (!pobierzZalogowanego()) {
            ustawZalogowanego('kacperpros45');
        }
        odswiezMenu();
        zmienStrone('home');
    </script>
</body>
</html>
