<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rynxo Fandom Demon List (RFDL)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #1f1f1f;
            border-bottom: 2px solid #333;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff4757;
            letter-spacing: 1px;
            cursor: pointer;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        nav a, nav span {
            color: #aaa;
            text-decoration: none;
            transition: color 0.2s;
            cursor: pointer;
            font-size: 0.95rem;
            white-space: nowrap;
        }

        nav a:hover, nav span:hover {
            color: #fff;
        }

        .user-info {
            color: #ff4757;
            font-weight: bold;
        }

        .badge-mod {
            background: #ffa502;
            color: #121212;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-left: 5px;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #fff;
        }

        p {
            color: #777;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .form-box {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #333;
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: left;
        }

        input, select, textarea {
            padding: 14px;
            background: #121212;
            border: 1px solid #333;
            color: #fff;
            border-radius: 6px;
            font-size: 16px;
            resize: vertical;
        }

        button {
            padding: 15px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: #ff6b81;
        }

        button:active {
            transform: scale(0.98);
        }

        button.btn-accept {
            background: #2ed573;
            padding: 10px 16px;
            font-size: 0.95rem;
        }
        button.btn-accept:hover {
            background: #26af5f;
        }

        button.btn-reject {
            background: #ff4757;
            padding: 10px 16px;
            font-size: 0.95rem;
        }
        button.btn-reject:hover {
            background: #ff6b81;
        }

        .level-list, .ranking-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .level-card, .ranking-card {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 15px 20px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            width: 100%;
        }

        .ranking-card {
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .ranking-card:hover {
            border-color: #ff4757;
        }

        .clickable-level {
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .clickable-level:hover {
            color: #ff4757;
            text-decoration: underline;
        }

        .level-info span {
            color: #888;
            font-size: 0.9rem;
            display: block;
            margin-top: 3px;
        }

        .level-info a {
            color: #ff4757;
            text-decoration: none;
            word-break: break-all;
        }

        .level-info a:hover {
            text-decoration: underline;
        }

        .level-pos {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff4757;
            margin-right: 20px;
            min-width: 40px;
        }

        .profile-box {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 25px;
            border-radius: 8px;
            width: 100%;
            text-align: left;
            margin-bottom: 20px;
            position: relative;
        }

        .profile-box h2 {
            color: #fff;
            margin-bottom: 10px;
        }

        .level-points-badge {
            position: absolute;
            top: 25px;
            right: 25px;
            background: #2ed573;
            color: #121212;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
        }

        .profile-stats {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
            width: 100%;
        }

        .profile-stats-row {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        .stat-card {
            background: #121212;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #222;
            flex: 1;
        }

        .stat-card-full {
            background: #121212;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #222;
            width: 100%;
        }

        .stat-card span, .stat-card-full span {
            color: #777;
            font-size: 0.85rem;
            display: block;
        }

        .stat-card strong, .stat-card-full strong {
            color: #ff4757;
            font-size: 1.3rem;
        }

        footer {
            background-color: #1f1f1f;
            text-align: center;
            padding: 15px;
            font-size: 0.9rem;
            color: #555;
            border-top: 1px solid #222;
        }

        .error-msg {
            color: #ff4757;
            font-size: 0.9rem;
        }
        
        .tabs-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #aaa;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #ff4757;
            color: white;
            border-color: #ff4757;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="zmienStrone('home')">RFDL</div>
        <nav id="nav-menu"></nav>
    </header>

    <main id="zawartosc"></main>

    <footer>
        &copy; 2026 Rynxo Fandom Demon List. Wszelkie prawa zastrzeżone.
    </footer>

    <script>
        const NPOINT_URL = 'https://api.npoint.io/93a79080be2664e1fee9';

        let appData = {
            users: [],
            levels: [],
            challenges: [],
            pending: [],
            pending_challenges: [],
            records: [],
            challenge_records: [],
            pending_records: [],
            pending_challenge_records: [],
            current_user: ''
        };

        async function fetchDataFromCloud() {
            try {
                const response = await fetch(NPOINT_URL);
                if (!response.ok) throw new Error(`Błąd HTTP: ${response.status}`);
                const data = await response.json();
                if (data && typeof data === 'object') {
                    appData = { ...appData, ...data };
                }
            } catch (error) {
                console.error('Nie udało się pobrać danych z npoint:', error);
            }
        }

        async function saveDataToCloud() {
            try {
                const response = await fetch(NPOINT_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(appData)
                });
                if (!response.ok) throw new Error(`Błąd zapisu HTTP: ${response.status}`);
            } catch (error) {
                console.error('Nie udało się zapisać danych na npoint:', error);
            }
        }

        function pobierzUzytkownikow() { return appData.users || []; }
        async function zapiszUzytkownikow(u) { appData.users = u; await saveDataToCloud(); }
        
        function pobierzPoziomy() { return appData.levels || []; }
        async function zapiszPoziomy(l) { appData.levels = l; await saveDataToCloud(); }

        function pobierzChallenge() { return appData.challenges || []; }
        async function zapiszChallenge(c) { appData.challenges = c; await saveDataToCloud(); }

        function pobierzOczekujace() { return appData.pending || []; }
        async function zapiszOczekujace(p) { appData.pending = p; await saveDataToCloud(); }

        function pobierzOczekujaceChallenge() { return appData.pending_challenges || []; }
        async function zapiszOczekujaceChallenge(pc) { appData.pending_challenges = pc; await saveDataToCloud(); }

        function pobierzRekordy() { return appData.records || []; }
        async function zapiszRekordy(r) { appData.records = r; await saveDataToCloud(); }

        function pobierzChallengeRekordy() { return appData.challenge_records || []; }
        async function zapiszChallengeRekordy(cr) { appData.challenge_records = cr; await saveDataToCloud(); }

        function pobierzOczekujaceRekordy() { return appData.pending_records || []; }
        async function zapiszOczekujaceRekordy(pr) { appData.pending_records = pr; await saveDataToCloud(); }

        function pobierzOczekujaceChallengeRekordy() { return appData.pending_challenge_records || []; }
        async function zapiszOczekujaceChallengeRekordy(pcr) { appData.pending_challenge_records = pcr; await saveDataToCloud(); }

        function pobierzZalogowanego() { return appData.current_user || ''; }
        async function ustawZalogowanego(u) { 
            appData.current_user = u ? u.trim() : ''; 
            await saveDataToCloud();
            odswiezMenu(); 
        }

        function czyJestModem(login) {
            if (!login) return false;
            return login.trim().toLowerCase() === 'kacperpros45';
        }

        function obliczPunktyZaPoziom(index) {
            const punkty = 250 - (index * 2.5);
            return Math.max(0, Number(punkty.toFixed(1)));
        }

        async function edytujPozycjePoziomu(index, kategoria = 'level') {
            const lista = kategoria === 'challenge' ? [...pobierzChallenge()] : [...pobierzPoziomy()];
            const nazwaListy = kategoria === 'challenge' ? 'Challenge List' : 'Demon List';
            const nowaPozycja = prompt(`Aktualna pozycja w ${nazwaListy}: ${index + 1}. Podaj nową pozycję (1-${lista.length}):`);
            if (nowaPozycja === null) return;
            
            let n = parseInt(nowaPozycja) - 1;
            if (isNaN(n) || n < 0 || n >= lista.length) {
                alert("Niepoprawna pozycja!");
                return;
            }

            const [element] = lista.splice(index, 1);
            lista.splice(n, 0, element);
            
            if (kategoria === 'challenge') {
                await zapiszChallenge(lista);
            } else {
                await zapiszPoziomy(lista);
            }
            zmienStrone('panel_moda');
        }

        function odswiezMenu() {
            const zalogowany = pobierzZalogowanego();
            const nav = document.getElementById('nav-menu');
            if (!nav) return;
            
            let html = `
                <a onclick="zmienStrone('home')">Strona główna</a>
                <a onclick="zmienStrone('lista')">Listy</a>
                <a onclick="zmienStrone('leaderboard')">Leaderboard</a>
            `;

            if (zalogowany) {
                let modBadge = czyJestModem(zalogowany) ? '<span class="badge-mod">MOD</span>' : '';
                html += `
                    <a onclick="zmienStrone('dodaj')">Zgłoś poziom</a>
                    <a onclick="zmienStrone('zglos_rekord')">Zgłoś rekord</a>
                `;
                
                if (czyJestModem(zalogowany)) {
                    html += `<a onclick="zmienStrone('panel_moda')" style="color:#ffa502; font-weight:bold;">🛡️ Panel Moda</a>`;
                }

                html += `
                    <span class="user-info">👤 ${zalogowany} ${modBadge}</span>
                    <a onclick="wyloguj()" style="color:#ff4757;">Wyloguj</a>
                `;
            } else {
                html += `
                    <a onclick="zmienStrone('login')">Logowanie</a>
                    <a onclick="zmienStrone('rejestracja')">Rejestracja</a>
                `;
            }

            nav.innerHTML = html;
        }

        async function wyloguj() {
            await ustawZalogowanego('');
            zmienStrone('home');
        }

        function zmienStrone(typ, extraParam = null) {
            const main = document.getElementById('zawartosc');
            if (!main) return;
            odswiezMenu();
            const zalogowany = pobierzZalogowanego();
            const jestModem = czyJestModem(zalogowany);
            
            if (typ === 'home') {
                main.innerHTML = `
                    <h1>Rynxo Fandom Demon List</h1>
                    <p>Oficjalny ranking poziomów i wyzwań. Zgłaszaj poziomy do Demon List oraz Challenge List, przechodź je i zdobywaj punkty!</p>
                `;
            } else if (typ === 'lista') {
                const aktywnaKategoria = extraParam === 'challenge' ? 'challenge' : 'level';
                const poziomy = aktywnaKategoria === 'challenge' ? pobierzChallenge() : pobierzPoziomy();
                
                let listaHtml = poziomy.length === 0 ? `<p>Brak zatwierdzonych pozycji w tej kategorii.</p>` : '<div class="level-list">';
                
                poziomy.forEach((lvl, index) => {
                    let modActions = jestModem ? `
                        <button class="btn-reject" onclick="usunZatwierdzonyPoziomLista(${index}, '${aktywnaKategoria}')" style="padding: 8px 12px; font-size: 0.9rem;">Usuń</button>
                    ` : '';

                    const punktyZaLvl = obliczPunktyZaPoziom(index);

                    listaHtml += `
                        <div class="level-card">
                            <div style="display: flex; align-items: center; width: 100%; justify-content: space-between;">
                                <div style="display: flex; align-items: center;">
                                    <div class="level-pos">#${index + 1}</div>
                                    <div class="level-info">
                                        <h3 class="clickable-level" onclick="zmienStrone('szczegoly_poziomu', '${encodeURIComponent(lvl.nazwa)}')">${lvl.nazwa} <span style="font-size:0.8rem; color:#aaa;">(ID: ${lvl.id})</span></h3>
                                        <span>Zweryfikował: ${lvl.autor} | <a href="${lvl.nagranie}" target="_blank">${lvl.nagranie}</a></span>
                                        <span style="color: #2ed573; font-weight: bold; margin-top: 4px;">+${punktyZaLvl} pkt</span>
                                    </div>
                                </div>
                                <div>${modActions}</div>
                            </div>
                        </div>
                    `;
                });
                if (poziomy.length > 0) listaHtml += '</div>';

                main.innerHTML = `
                    <h1>Listy poziomów</h1>
                    <div class="tabs-container">
                        <button class="tab-btn ${aktywnaKategoria === 'level' ? 'active' : ''}" onclick="zmienStrone('lista', 'level')">Demon List</button>
                        <button class="tab-btn ${aktywnaKategoria === 'challenge' ? 'active' : ''}" onclick="zmienStrone('lista', 'challenge')">Challenge List</button>
                    </div>
                    <p>Wybierz kategorię i kliknij na nazwę, aby zobaczyć szczegóły oraz rekordy.</p>
                    ${listaHtml}
                `;
            } else if (typ === 'szczegoly_poziomu') {
                const nazwaPoziomu = decodeURIComponent(extraParam);
                const poziomy = pobierzPoziomy();
                const challenge = pobierzChallenge();
                
                const isChallenge = challenge.some(c => c.nazwa.toLowerCase() === nazwaPoziomu.toLowerCase());
                const listaAktualna = isChallenge ? challenge : poziomy;
                const indexPoziomu = listaAktualna.findIndex(l => l.nazwa.toLowerCase() === nazwaPoziomu.toLowerCase());
                
                const lvlObj = indexPoziomu !== -1 ? listaAktualna[indexPoziomu] : null;
                const punktyZaTenPoziom = indexPoziomu !== -1 ? obliczPunktyZaPoziom(indexPoziomu) : 250;
                
                const ukoczenia = isChallenge ? pobierzChallengeRekordy().filter(r => r.poziom.toLowerCase() === nazwaPoziomu.toLowerCase()) : pobierzRekordy().filter(r => r.poziom.toLowerCase() === nazwaPoziomu.toLowerCase());

                let listaUkonczonychHtml = ukoczenia.length === 0 ? '<p>Nikt jeszcze nie ukończył tego poziomu.</p>' : '<div class="level-list">';
                
                ukoczenia.forEach(rec => {
                    let modTag = czyJestModem(rec.gracz) ? '<span class="badge-mod">MOD</span>' : '';
                    listaUkonczonychHtml += `
                        <div class="level-card">
                            <div class="level-info" style="text-align: left; width: 100%; display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <h3 class="clickable-level" onclick="zmienStrone('profil', '${rec.gracz}')">${rec.gracz} ${modTag}</h3>
                                    <span><a href="${rec.url}" target="_blank">${rec.url}</a></span>
                                </div>
                            </div>
                        </div>
                    `;
                });
                if (ukoczenia.length > 0) listaUkonczonychHtml += '</div>';

                main.innerHTML = `
                    <div class="profile-box">
                        <div class="level-points-badge">+${punktyZaTenPoziom} pkt</div>
                        <h2>${lvlObj ? lvlObj.nazwa : nazwaPoziomu}</h2>
                        <span style="color: #aaa; font-size: 0.95rem; display: block; margin-top: -5px; margin-bottom: 15px;">Zweryfikował: ${lvlObj ? lvlObj.autor : 'Nieznany'}</span>
                        <div class="profile-stats">
                            <div class="profile-stats-row">
                                <div class="stat-card">
                                    <span>ID Poziomu</span>
                                    <strong>${lvlObj ? lvlObj.id : 'Brak'}</strong>
                                </div>
                                <div class="stat-card">
                                    <span>Liczba ukończeń</span>
                                    <strong>${ukoczenia.length} graczy</strong>
                                </div>
                            </div>
                        </div>
                    </div>
                    <h3 style="color:#fff; text-align:left; width:100%; margin-top:10px;">Gracze, którzy ukończyli ten poziom:</h3>
                    ${listaUkonczonychHtml}
                    <button onclick="zmienStrone('lista')" style="margin-top:20px; width:100%;">Powrót do listy</button>
                `;
            } else if (typ === 'leaderboard') {
                const aktywnaKategoria = extraParam === 'challenge' ? 'challenge' : 'level';
                const rekordy = aktywnaKategoria === 'challenge' ? pobierzChallengeRekordy() : pobierzRekordy();
                const listaPoziomow = aktywnaKategoria === 'challenge' ? pobierzChallenge() : pobierzPoziomy();
                
                let allNames = new Set();
                pobierzUzytkownikow().forEach(u => { if (u && u.login) allNames.add(u.login); });
                pobierzRekordy().forEach(r => { if (r && r.gracz) allNames.add(r.gracz); });
                pobierzChallengeRekordy().forEach(r => { if (r && r.gracz) allNames.add(r.gracz); });
                pobierzOczekujace().forEach(o => { if (o && o.autor) allNames.add(o.autor); });
                pobierzOczekujaceChallenge().forEach(o => { if (o && o.autor) allNames.add(o.autor); });
                pobierzOczekujaceRekordy().forEach(o => { if (o && o.gracz) allNames.add(o.gracz); });
                pobierzOczekujaceChallengeRekordy().forEach(o => { if (o && o.gracz) allNames.add(o.gracz); });
                
                allNames.add('kacperpros45');

                let punkty = {};
                allNames.forEach(login => {
                    punkty[login] = 0;
                });
                
                rekordy.forEach(rec => {
                    const idx = listaPoziomow.findIndex(l => l.nazwa.toLowerCase() === rec.poziom.toLowerCase());
                    const pktZaLvl = idx !== -1 ? obliczPunktyZaPoziom(idx) : 0;
                    
                    if (punkty[rec.gracz] !== undefined) {
                        punkty[rec.gracz] += pktZaLvl;
                    } else {
                        punkty[rec.gracz] = pktZaLvl;
                    }
                });

                let ranking = Object.keys(punkty)
                    .map(login => ({ login, punkty: Number(punkty[login].toFixed(1)) }))
                    .sort((a, b) => b.punkty - a.punkty);

                let rankingHtml = ranking.length === 0 ? '<p>Brak graczy w bazie.</p>' : '<div class="level-list">';
                ranking.forEach((gracz, index) => {
                    let modTag = czyJestModem(gracz.login) ? '<span class="badge-mod">MOD</span>' : '';
                    rankingHtml += `
                        <div class="ranking-card" onclick="zmienStrone('profil', '${gracz.login}')">
                            <div style="display: flex; align-items: center; gap: 15px; width: 100%;">
                                <div class="level-pos">#${index + 1}</div>
                                <div class="level-info" style="flex: 1;">
                                    <h3>${gracz.login} ${modTag}</h3>
                                    <span>Punkty: ${gracz.punkty} pkt</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
                if (ranking.length > 0) rankingHtml += '</div>';

                main.innerHTML = `
                    <h1>Leaderboard</h1>
                    <div class="tabs-container">
                        <button class="tab-btn ${aktywnaKategoria === 'level' ? 'active' : ''}" onclick="zmienStrone('leaderboard', 'level')">Demon List</button>
                        <button class="tab-btn ${aktywnaKategoria === 'challenge' ? 'active' : ''}" onclick="zmienStrone('leaderboard', 'challenge')">Challenge List</button>
                    </div>
                    <p>Wybierz kategorię i kliknij na gracza, aby zobaczyć jego profil i szczegółowe statystyki.</p>
                    ${rankingHtml}
                `;
            } else if (typ === 'profil') {
                const nazwaGracza = extraParam;
                const rekordyDemon = pobierzRekordy();
                const rekordyChallenge = pobierzChallengeRekordy();
                const poziomy = pobierzPoziomy();
                const challenge = pobierzChallenge();

                const graczDemonRec = rekordyDemon.filter(r => r.gracz.toLowerCase() === nazwaGracza.toLowerCase());
                const graczChalRec = rekordyChallenge.filter(r => r.gracz.toLowerCase() === nazwaGracza.toLowerCase());

                let punktyDemon = 0;
                graczDemonRec.forEach(rec => {
                    const idx = poziomy.findIndex(l => l.nazwa.toLowerCase() === rec.poziom.toLowerCase());
                    if (idx !== -1) punktyDemon += obliczPunktyZaPoziom(idx);
                });

                let punktyChallenge = 0;
                graczChalRec.forEach(rec => {

        function aktualizujListePoziomowRekordu() {

        async function zarejestruj() {
            const login = document.getElementById('reg-login').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();
            const err = document.getElementById('reg-error');

            if (!login || !pass) {
                err.innerText = "Wypełnij wszystkie pola!";
                return;
            }

            let users = [...pobierzUzytkownikow()];
            if (users.some(u => u.login.toLowerCase() === login.toLowerCase())) {
                err.innerText = "Taki użytkownik już istnieje!";
                return;
            }

            users.push({ login, pass });
            await zapiszUzytkownikow(users);
            await ustawZalogowanego(login);
            zmienStrone('home');
        }

        async function zaloguj() {
            const login = document.getElementById('log-login').value.trim();
            const pass = document.getElementById('log-pass').value.trim();
            const err = document.getElementById('log-error');

            let users = pobierzUzytkownikow();
            const user = users.find(u => u.login.toLowerCase() === login.toLowerCase() && u.pass === pass);

            if (!user && login.toLowerCase() !== 'kacperpros45') {
                err.innerText = "Niepoprawny login lub hasło!";
                return;
            }

            await ustawZalogowanego(login);
            zmienStrone('home');
        }

        async function wyslijZgłoszenie() {
            const kategoria = document.getElementById('lvl-kategoria').value;
            const nazwa = document.getElementById('lvl-name').value.trim();
            const id = document.getElementById('lvl-id').value.trim();
            const nagranie = document.getElementById('lvl-nagranie').value.trim();
            const pozycja = parseInt(document.getElementById('lvl-pozycja').value);
            const err = document.getElementById('lvl-error');
            const autor = pobierzZalogowanego();

            if (!autor) {
                alert("Musisz być zalogowany, aby zgłosić poziom!");
                zmienStrone('login');
                return;
            }

            if (!nazwa || !id || !nagranie || isNaN(pozycja)) {
                err.innerText = "Wypełnij wszystkie pola poprawnie!";
                return;
            }

            if (kategoria === 'challenge') {
                let oczekujace = [...pobierzOczekujaceChallenge()];
                oczekujace.push({ nazwa, id, nagranie, pozycja, autor });
                await zapiszOczekujaceChallenge(oczekujace);
            } else {
                let oczekujace = [...pobierzOczekujace()];
                oczekujace.push({ nazwa, id, nagranie, pozycja, autor });
                await zapiszOczekujace(oczekujace);
            }
            
            alert("Zgłoszenie poziomu zostało wysłane do akceptacji!");
            zmienStrone('lista', kategoria);
        }

        async function wyslijRekord() {
            const kategoria = document.getElementById('rec-kategoria').value;
            const poziom = document.getElementById('rec-level').value;
            const url = document.getElementById('rec-url').value.trim();
            const err = document.getElementById('rec-error');
            const gracz = pobierzZalogowanego();

            if (!gracz) {
                alert("Musisz być zalogowany, aby zgłosić rekord!");
                zmienStrone('login');
                return;
            }

            if (!poziom || !url) {
                err.innerText = "Wypełnij wszystkie pola, w tym wybierz poziom!";
                return;
            }

            if (kategoria === 'challenge') {
                let oczekujace = [...pobierzOczekujaceChallengeRekordy()];
                oczekujace.push({ poziom, url, gracz });
                await zapiszOczekujaceChallengeRekordy(oczekujace);
            } else {
                let oczekujace = [...pobierzOczekujaceRekordy()];
                oczekujace.push({ poziom, url, gracz });
                await zapiszOczekujaceRekordy(oczekujace);
            }

            alert("Zgłoszenie rekordu zostało wysłane do akceptacji!");
            zmienStrone('leaderboard', kategoria);
        }

        async function akceptujZgłoszenie(index, kategoria = 'level') {
            if (kategoria === 'challenge') {
                let oczekujace = [...pobierzOczekujaceChallenge()];
                let lista = [...pobierzChallenge()];
                let rekordy = [...pobierzChallengeRekordy()];

                let zatwierdzony = oczekujace.splice(index, 1)[0];
                let docelowaPozycja = zatwierdzony.pozycja - 1;
                if (docelowaPozycja < 0) docelowaPozycja = 0;
                if (docelowaPozycja > lista.length) {
                    lista.push(zatwierdzony);
                } else {
                    lista.splice(docelowaPozycja, 0, zatwierdzony);
                }

                rekordy.push({
                    poziom: zatwierdzony.nazwa,
                    url: zatwierdzony.nagranie,
                    gracz: zatwierdzony.autor
                });

                await zapiszOczekujaceChallenge(oczekujace);
                await zapiszChallenge(lista);
                await zapiszChallengeRekordy(rekordy);
            } else {
                let oczekujace = [...pobierzOczekujace()];
                let lista = [...pobierzPoziomy()];
                let rekordy = [...pobierzRekordy()];

                let zatwierdzony = oczekujace.splice(index, 1)[0];
                let docelowaPozycja = zatwierdzony.pozycja - 1;
                if (docelowaPozycja < 0) docelowaPozycja = 0;
                if (docelowaPozycja > lista.length) {
                    lista.push(zatwierdzony);
                } else {
                    lista.splice(docelowaPozycja, 0, zatwierdzony);
                }

                rekordy.push({
                    poziom: zatwierdzony.nazwa,
                    url: zatwierdzony.nagranie,

                });

                await zapiszOczekujace(oczekujace);
                await zapiszPoziomy(lista);
                await zapiszRekordy(rekordy);
            }
            zmienStrone('panel_moda');
        }
